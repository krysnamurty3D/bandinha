<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandinha</title>
<style>
  body{background:#140E09;color:#F6EEDC;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;text-align:center;}
  a{color:#E8A63C;}
</style>
</head>
<body>
  <div id="msg">Página não encontrada. <a href="/">Voltar ao início</a></div>
  <script>
    // Rotas "bonitas" por equipe do app eccejc (ex: k3d.app.br/eccejc/janeladeoracao)
    // não têm pasta própria no repositório — reconhecemos aqui e redirecionamos pra
    // eccejc/publico.html?equipe=... . Qualquer outro caminho desconhecido (de qualquer
    // app hospedado neste domínio) cai no aviso acima.
    (function(){
      const partes = location.pathname.replace(/^\/+|\/+$/g, "").split("/");
      const reservado = ["painel", "publico.html", "index.html", "manifest.json", "manifest-editor.json", "firebase-messaging-sw.js", "header.png", "og-image.jpg"];
      if(partes[0] === "eccejc" && partes.length === 2 && /^[a-z0-9-]+$/.test(partes[1]) && !reservado.includes(partes[1])){
        location.replace("/eccejc/publico.html?equipe=" + encodeURIComponent(partes[1]) + location.search.replace(/^\?/, "&"));
      }
    })();
  </script>
</body>
</html>
