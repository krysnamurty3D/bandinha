        camisas: data.camisas,
        configFinanceiro: data.configFinanceiro,
        configCamisas: data.configCamisas,
        config: data.config
      };
      const blob = new Blob([JSON.stringify(exportado, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `bandinha-backup-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast("Backup baixado");
    });

    const btnRelatorioPdf = document.getElementById("btn-relatorio-pdf");
    if(btnRelatorioPdf) btnRelatorioPdf.addEventListener("click", () => {
      const genLabel = { M: "Homem", F: "Mulher" };
      const linhas = [...data.integrantes].sort((a,b) => a.nome.localeCompare(b.nome, "pt-BR", { sensitivity: "base" })).map(i => {
        const respostaCamisa = data.camisas.find(c => c.id === slugify(i.nome));
        return `
        <tr>
          <td>${escapeHtml(i.nome)}</td>
          <td>${genLabel[i.genero] || "—"}</td>
          <td>${i.confirmado ? "Confirmado" : "A convidar"}</td>
          <td>${i.instrumental ? "Sim" : "—"}</td>
          <td>${respostaCamisa ? escapeHtml(respostaCamisa.tamanho) : "—"}</td>
          <td>${i.inscricao ? "Pago" : "Em aberto"}</td>
          <td>${i.taxaEquipe ? "Pago" : "Em aberto"}</td>
          <td>${i.oferta > 0 ? formatMoeda(i.oferta) : "—"}</td>
        </tr>
      `;
      }).join("");
      document.getElementById("print-report").innerHTML = `
        <h1>Relatório de Integrantes — ${escapeHtml(data.config.titulo || "Bandinha")}</h1>
        <div class="print-meta">Gerado em ${new Date().toLocaleDateString("pt-BR")} · ${data.integrantes.length} integrantes</div>
        <table>
          <thead><tr><th>Nome</th><th>Sexo</th><th>Status</th><th>Instrumental</th><th>Camisa</th><th>Inscrição</th><th>Taxa Equipe</th><th>Oferta</th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      `;
      window.print();
    });

    const btnRelatorioExcel = document.getElementById("btn-relatorio-excel");
    if(btnRelatorioExcel) btnRelatorioExcel.addEventListener("click", () => {
      const genLabel = { M: "Homem", F: "Mulher" };
      const csvEscape = v => `"${String(v).replace(/"/g, '""')}"`;
      const cabecalho = ["Nome", "Sexo", "Status", "Instrumental", "Camisa", "Inscrição", "Taxa Equipe", "Oferta"];
      const linhas = [...data.integrantes].sort((a,b) => a.nome.localeCompare(b.nome, "pt-BR", { sensitivity: "base" })).map(i => {
        const respostaCamisa = data.camisas.find(c => c.id === slugify(i.nome));
        return [
          i.nome,
          genLabel[i.genero] || "—",
          i.confirmado ? "Confirmado" : "A convidar",
          i.instrumental ? "Sim" : "—",
          respostaCamisa ? respostaCamisa.tamanho : "—",
          i.inscricao ? "Pago" : "Em aberto",
          i.taxaEquipe ? "Pago" : "Em aberto",
          i.oferta > 0 ? formatMoeda(i.oferta) : "—"
        ].map(csvEscape).join(";");
      });
      const csv = "﻿" + [cabecalho.map(csvEscape).join(";"), ...linhas].join("\r\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `integrantes-${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast("Relatório Excel baixado");
    });

    const btnToggleImport = document.getElementById("btn-toggle-import");
    if(btnToggleImport) btnToggleImport.addEventListener("click", () => {
      importOpen = !importOpen;
      render();
    });

    const btnImportNomes = document.getElementById("btn-import-nomes");
    if(btnImportNomes) btnImportNomes.addEventListener("click", async () => {
      const textarea = document.getElementById("input-import-nomes");
      const generoSelect = document.getElementById("input-import-genero");
      const instrumentalCheck = document.getElementById("input-import-instrumental");
      const raw = textarea.value;
      const genero = generoSelect.value;
      const instrumental = instrumentalCheck.checked;
      if(!genero){ showToast("Escolha se são rapazes ou moças"); return; }
      if(!raw.trim()){ showToast("Cole ao menos um nome"); return; }
      const nomes = raw
        .split(/[\n,;]/)
        .map(s => s.trim())
        .filter(s => s.length > 0);
      if(nomes.length === 0){ showToast("Nenhum nome encontrado"); return; }
      const existentes = new Set(data.integrantes.map(i => i.nome.toLowerCase()));
      const novos = [];
      nomes.forEach(nome => {
        if(!existentes.has(nome.toLowerCase())){
          novos.push({ id: uid(), nome, genero, instrumental, camisa: "", inscricao: false, pagamentoCamisa: false, taxaEquipe: false, confirmado: false });
          existentes.add(nome.toLowerCase());
        }
      });
      importOpen = false;
      await Promise.all(novos.map(n => setDoc(doc(integrantesCol, n.id), n)));
      render();
      const adicionados = novos.length;
      const repetidos = nomes.length - adicionados;
      showToast(`${adicionados} nome${adicionados===1?"":"s"} importado${adicionados===1?"":"s"}${repetidos>0?` (${repetidos} já existia${repetidos===1?"":"m"})`:""}`);
    });

    document.querySelectorAll('[data-action="toggle-membro"]').forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        expandedMemberId = (expandedMemberId === id) ? null : id;
        render();
      });
    });

    document.querySelectorAll('[data-action="edit-nome"]').forEach(el => {
      el.addEventListener("click", () => {
        editingNameId = el.dataset.id;
        render();
        const input = document.querySelector('.edit-nome-input');
        if(input){ input.focus(); input.select(); }
      });
    });

    async function commitNomeEdit(id, input){
      const item = data.integrantes.find(i => i.id === id);
      const novoNome = input.value.trim();
      if(item && novoNome){ await updateDoc(doc(integrantesCol, id), { nome: novoNome }); }
      editingNameId = null;
      render();
    }

    document.querySelectorAll('[data-action="save-nome"]').forEach(el => {
      el.addEventListener("click", () => {
        const input = document.querySelector('.edit-nome-input');
        if(input) commitNomeEdit(el.dataset.id, input);
      });
    });

    document.querySelectorAll('.edit-nome-input').forEach(el => {
      el.addEventListener("keydown", e => {
        if(e.key === "Enter"){ e.preventDefault(); commitNomeEdit(el.dataset.id, el); }
        else if(e.key === "Escape"){ editingNameId = null; render(); }
      });
      el.addEventListener("blur", () => {
        if(editingNameId === el.dataset.id) commitNomeEdit(el.dataset.id, el);
      });
    });

    document.querySelectorAll('[data-action="toggle-inscricao"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(!item) return;
        await updateDoc(doc(integrantesCol, item.id), { inscricao: !item.inscricao });
      });
    });

    document.querySelectorAll('[data-action="toggle-taxa"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(!item) return;
        await updateDoc(doc(integrantesCol, item.id), { taxaEquipe: !item.taxaEquipe });
      });
    });

    document.querySelectorAll('[data-action="edit-oferta"]').forEach(el => {
      el.addEventListener("click", () => {
        editingOfertaId = el.dataset.id;
        render();
        const input = document.getElementById("input-edit-oferta");
        if(input){ input.focus(); input.select(); }
      });
    });

    document.querySelectorAll('[data-action="save-oferta"]').forEach(el => {
      el.addEventListener("click", async () => {
        const input = document.getElementById("input-edit-oferta");
        if(input){
          const valor = parseFloat(input.value.replace(",", ".")) || 0;
          await updateDoc(doc(integrantesCol, el.dataset.id), { oferta: valor });
        }
        editingOfertaId = null;
        render();
      });
    });

    document.querySelectorAll('[data-action="toggle-confirmado"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(item){ await updateDoc(doc(integrantesCol, item.id), { confirmado: !item.confirmado }); }
      });
    });

    document.querySelectorAll('[data-action="toggle-instrumental"]').forEach(el => {
      el.addEventListener("change", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(item){ await updateDoc(doc(integrantesCol, item.id), { instrumental: el.checked }); }
      });
    });

    document.querySelectorAll('[data-action="toggle-camisa-definida"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(item){ await updateDoc(doc(integrantesCol, item.id), { camisaDefinida: !item.camisaDefinida }); }
      });
    });

    document.querySelectorAll('[data-action="fix-gender"]').forEach(el => {
      el.addEventListener("change", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(item){ await updateDoc(doc(integrantesCol, item.id), { genero: el.value }); }
      });
    });

    document.querySelectorAll('[data-action="toggle-group"]').forEach(el => {
      el.addEventListener("click", () => {
        const g = el.dataset.group;
        collapsedGroups[g] = !collapsedGroups[g];
        render();
      });
    });

    document.querySelectorAll('[data-action="toggle-progresso-group"]').forEach(el => {
      el.addEventListener("click", () => {
        if(editingProgressoNome) return;
        const key = "prog-" + el.dataset.nome;
        collapsedProgressoGroups[key] = !collapsedProgressoGroups[key];
        render();
      });
    });

    document.querySelectorAll('[data-action="rename-progresso"]').forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        editingProgressoNome = el.dataset.nome;
        render();
        const input = document.getElementById("input-rename-progresso");
        if(input){ input.focus(); input.select(); }
      });
    });

    document.querySelectorAll('[data-action="save-rename-progresso"]').forEach(el => {
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        const nomeAntigo = el.dataset.nome;
        const input = document.getElementById("input-rename-progresso");
        const novoNome = input ? input.value.trim() : "";
        if(novoNome && novoNome !== nomeAntigo){
          const entradas = data.progresso.filter(p => p.nome === nomeAntigo);
          await Promise.all(entradas.map(p => {
            const novoDocId = `${slugify(novoNome)}_${p.musicaId}`;
            const { docId, ...campos } = p;
            return setDoc(doc(progressoCol, novoDocId), { ...campos, nome: novoNome })
              .then(() => deleteDoc(doc(progressoCol, docId)));
          }));
          showToast("Nome atualizado");
        }
        editingProgressoNome = null;
        render();
      });
    });

    document.querySelectorAll('[data-action="del-progresso-nome"]').forEach(el => {
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        const nome = el.dataset.nome;
        if(!confirm(`Remover todo o progresso de "${nome}"?`)) return;
        const entradas = data.progresso.filter(p => p.nome === nome);
        await Promise.all(entradas.map(p => deleteDoc(doc(progressoCol, p.docId))));
        showToast("Progresso removido");
      });
    });

    document.querySelectorAll('[data-action="del-progresso-entrada"]').forEach(el => {
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        if(!confirm("Remover esta marcação?")) return;
        await deleteDoc(doc(progressoCol, el.dataset.docid));
      });
    });

    document.querySelectorAll('[data-action="del-integrante"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(!confirm(`Remover ${item ? item.nome : "este integrante"}?`)) return;
        await deleteDoc(doc(integrantesCol, el.dataset.id)); showToast("Integrante removido");
      });
    });

    document.querySelectorAll('[data-action="toggle-musica"]').forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        openMusicaId = (openMusicaId === id) ? null : id;
        editingLetraId = null;
        editingAudioId = null;
        render();
      });
    });

    document.querySelectorAll('[data-action="edit-letra"]').forEach(el => {
      el.addEventListener("click", () => {
        editingLetraId = el.dataset.id;
        render();
      });
    });

    document.querySelectorAll('[data-action="edit-audio"]').forEach(el => {
      el.addEventListener("click", () => {
        editingAudioId = el.dataset.id;
        render();
      });
    });

    document.querySelectorAll('[data-action="cancelar-edit-audio"]').forEach(el => {
      el.addEventListener("click", () => {
        editingAudioId = null;
        render();
      });
    });

    document.querySelectorAll('[data-action="remover-audio"]').forEach(el => {
      el.addEventListener("click", async () => {
        if(!confirm("Remover o áudio desta música?")) return;
        await updateDoc(doc(musicasCol, el.dataset.id), { audioUrl: deleteField(), audioId: deleteField() });
        editingAudioId = null;
        render();
      });
    });

    const inputAudioFile = document.getElementById("input-audio-file");
    if(inputAudioFile) inputAudioFile.addEventListener("change", async () => {
      const file = inputAudioFile.files[0];
      const musicaId = inputAudioFile.dataset.id;
      if(!file || !musicaId) return;
      if(!file.type.startsWith("audio/")){ showToast("Selecione um arquivo de áudio"); return; }
      enviandoAudioId = musicaId;
      render();
      try{
        const ext = file.name.includes(".") ? file.name.split(".").pop() : "mp3";
        const path = `audio/${musicaId}-${Date.now()}.${ext}`;
        const fileRef = storageRef(storage, path);
        await uploadBytes(fileRef, file);
        const url = await getDownloadURL(fileRef);
        await updateDoc(doc(musicasCol, musicaId), { audioUrl: url, audioId: deleteField() });
        showToast("Áudio enviado!");
      }catch(err){
        console.error(err);
        showToast("Erro ao enviar áudio");
      }
      enviandoAudioId = null;
      editingAudioId = null;
      render();
    });

    document.querySelectorAll('[data-action="save-letra"]').forEach(el => {
      el.addEventListener("click", async () => {
        const textarea = document.querySelector('.lyrics-textarea');
        const item = data.musicas.find(m => m.id === el.dataset.id);
        if(item && textarea){ await updateDoc(doc(musicasCol, item.id), { letra: textarea.value.trim() }); }
        editingLetraId = null;
        render();
      });
    });

    document.querySelectorAll('[data-action="edit-musica-nome"]').forEach(el => {
      el.addEventListener("click", () => {
        editingMusicaNomeId = el.dataset.id;
        render();
        const input = document.getElementById("input-edit-musica-nome");
        if(input){ input.focus(); input.select(); }
      });
    });

    async function salvarMusicaNome(id, input){
      const novoNome = input.value.trim();
      if(novoNome){ await updateDoc(doc(musicasCol, id), { nome: novoNome }); }
      editingMusicaNomeId = null;
      render();
    }

    document.querySelectorAll('[data-action="save-musica-nome"]').forEach(el => {
      el.addEventListener("click", () => {
        const input = document.getElementById("input-edit-musica-nome");
        if(input) salvarMusicaNome(el.dataset.id, input);
      });
    });

    const inputEditMusicaNome = document.getElementById("input-edit-musica-nome");
    if(inputEditMusicaNome){
      inputEditMusicaNome.addEventListener("keydown", e => {
        if(e.key === "Enter"){ e.preventDefault(); salvarMusicaNome(inputEditMusicaNome.dataset.id, inputEditMusicaNome); }
        else if(e.key === "Escape"){ editingMusicaNomeId = null; render(); }
      });
      inputEditMusicaNome.addEventListener("blur", () => {
        if(editingMusicaNomeId === inputEditMusicaNome.dataset.id) salvarMusicaNome(inputEditMusicaNome.dataset.id, inputEditMusicaNome);
      });
    }

    document.querySelectorAll('[data-action="toggle-pronta-musica"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.musicas.find(m => m.id === el.dataset.id);
        if(!item) return;
        const novoStatus = item.status === "pronta" ? "ensaiando" : "pronta";
        await updateDoc(doc(musicasCol, item.id), { status: novoStatus });
        showToast(novoStatus === "pronta" ? "Música marcada como pronta" : "Música voltou para ensaiando");
      });
    });

    document.querySelectorAll('[data-action="toggle-nova-musica"]').forEach(el => {
      el.addEventListener("click", async () => {
        const nova = el.checked;
        try{
          await updateDoc(doc(musicasCol, el.dataset.id), nova ? { nova: true, novaDesde: Date.now() } : { nova: false, novaDesde: deleteField() });
          showToast(nova ? "Marcada como nova" : "Removida a marca de nova");
        }catch(err){
          console.error(err);
          showToast("Erro ao atualizar");
        }
      });
    });

    document.querySelectorAll('[data-action="mudar-categoria-musica"]').forEach(el => {
      el.addEventListener("change", async () => {
        try{
          await updateDoc(doc(musicasCol, el.dataset.id), { categoria: el.value });
          showToast("Categoria atualizada");
        }catch(err){
          console.error(err);
          showToast("Erro ao atualizar");
        }
      });
    });

    document.querySelectorAll('[data-action="move-musica"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.musicas.find(m => m.id === el.dataset.id);
        if(!item) return;
        const cat = categoriaDaMusica(item);
        const grupo = data.musicas.filter(m => categoriaDaMusica(m) === cat).sort(compararMusicas);
        const idx = grupo.findIndex(m => m.id === item.id);
        const dir = el.dataset.dir === "up" ? -1 : 1;
        const alvoIdx = idx + dir;
        if(alvoIdx < 0 || alvoIdx >= grupo.length) return;
        [grupo[idx], grupo[alvoIdx]] = [grupo[alvoIdx], grupo[idx]];
        try{
          await Promise.all(grupo.map((m, i) => updateDoc(doc(musicasCol, m.id), { ordemCategoria: i })));
        }catch(err){
          console.error(err);
          showToast("Erro ao reordenar");
        }
      });
    });

    document.querySelectorAll('[data-action="toggle-visivel-musica"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.musicas.find(m => m.id === el.dataset.id);
        if(!item) return;
        const oculta = item.visivel === false;
        await updateDoc(doc(musicasCol, item.id), { visivel: oculta });
        showToast(oculta ? "Música visível na página pública" : "Música ocultada da página pública");
      });
    });

    document.querySelectorAll('[data-action="del-musica"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.musicas.find(m => m.id === el.dataset.id);
        if(!confirm(`Remover ${item ? `"${item.nome}"` : "esta música"}?`)) return;
        await deleteDoc(doc(musicasCol, el.dataset.id)); showToast("Música removida");
      });
    });

    document.querySelectorAll('[data-action="toggle-roteiro"]').forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        openRoteiroId = (openRoteiroId === id) ? null : id;
        render();
      });
    });

    document.querySelectorAll('[data-action="del-roteiro"]').forEach(el => {
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        const r = data.roteiros.find(r => r.id === el.dataset.id);
        if(!confirm(`Remover o roteiro ${r ? `"${r.titulo}"` : ""}?`)) return;
        await deleteDoc(doc(roteirosCol, el.dataset.id)); showToast("Roteiro removido");
      });
    });

    document.querySelectorAll('[data-action="del-item"]').forEach(el => {
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        if(!confirm("Remover este horário do roteiro?")) return;
        const r = data.roteiros.find(r => r.id === el.dataset.roteiro);
        if(r){
          const novosItens = r.itens.filter(it => it.id !== el.dataset.item);
          await updateDoc(doc(roteirosCol, r.id), { itens: novosItens });
        }
      });
    });

    document.querySelectorAll('[data-action="form-add-item"]').forEach(form => {
      form.addEventListener("submit", async e => {
        e.preventDefault();
        e.stopPropagation();
        const r = data.roteiros.find(r => r.id === form.dataset.roteiro);
        if(!r) return;
        const horario = form.querySelector(".item-horario-input").value.trim();
        const atividade = form.querySelector(".item-atividade-input").value.trim();
        if(!horario || !atividade) return;
        openRoteiroId = r.id;
        const novosItens = [...r.itens, { id: uid(), horario, atividade }];
        await updateDoc(doc(roteirosCol, r.id), { itens: novosItens });
      });
    });
  }

  function irParaTab(tab){
    currentTab = tab;
    render();
  }

  if(navigator.serviceWorker) navigator.serviceWorker.addEventListener("message", e => {
    if(e.data?.type === "goto" && e.data.url){
      const tab = new URL(e.data.url, location.href).searchParams.get("tab");
      if(tab) irParaTab(tab);
    }
  });

  const tabDaUrl = new URLSearchParams(location.search).get("tab");
  if(tabDaUrl) currentTab = tabDaUrl;

  document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

  initFontScale();
  initPush();
  loadAuth();
  if(tabDaUrl) irParaTab(tabDaUrl);

  setInterval(() => {
    const focused = document.activeElement;
    const isTyping = focused && (focused.tagName === "INPUT" || focused.tagName === "TEXTAREA");
    if(currentTab === "roteiros" && loaded && !isTyping) render();
  }, 30000);

  setInterval(() => {
    const focused = document.activeElement;
    const isTyping = focused && (focused.tagName === "INPUT" || focused.tagName === "TEXTAREA");
    if(currentTab === "aovivo" && loaded && !isTyping) render();
  }, 1000);
})();
</script>
</body>
</html>
