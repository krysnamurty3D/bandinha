<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bandinha</title>
<link rel="manifest" href="manifest-editor.json">
<style>
  :root{
    --bg: #140E09;
    --surface: #221810;
    --surface-2: #2E2116;
    --gold: #E8A63C;
    --cream: #F6EEDC;
    --muted: #B6A489;
    --rose: #D8492E;
    --green: #8AAD6B;
    --blue: #C9932E;
    --line: rgba(246,238,220,0.10);
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;touch-action:manipulation;}
  body{
    background: var(--bg);
    color: var(--cream);
    font-family:var(--font);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:24px;
  }
  header.top{
    position:relative;
    overflow:hidden;
    aspect-ratio:1920/819;
    background-image:url('header.png');
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:flex-end;
  }
  header.top::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(23,19,15,0.92) 0%, rgba(23,19,15,0.35) 45%, transparent 75%);
    pointer-events:none;
  }
  .brand{
    position:relative;
    z-index:1;
    padding:14px 20px 14px 20px;
    font-family:var(--font);
    font-weight:700;
    font-size:calc(28px * var(--font-scale, 1));
    letter-spacing:0.2px;
    display:flex;
    align-items:baseline;
    gap:10px;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  .brand small{
    font-family:var(--font);
    font-weight:500;
    font-size:calc(12px * var(--font-scale, 1));
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold);
  }
  .btn-logout{
    position:absolute;
    top:14px; right:14px;
    z-index:2;
    background:rgba(23,19,15,0.6);
    color:var(--cream);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 12px;
    font-size:calc(11px * var(--font-scale, 1));
    font-weight:600;
  }
  #auth-gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .login-box{
    width:100%;
    max-width:340px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px 24px;
  }
  .login-box form{display:flex;flex-direction:column;}

  main{
    flex:1;
    padding:6px 18px 20px 18px;
  }
  .section-title{
    font-family:var(--font);
    font-weight:600;
    font-size:calc(20px * var(--font-scale, 1));
    margin:18px 2px 12px 2px;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    user-select:none;
  }
  .section-title .chevron{margin-left:auto;}
  .note-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--gold);
    display:inline-block;
    flex-shrink:0;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }
  .home-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .sec-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 14px 12px;
    display:flex;
    flex-direction:column;
    gap:14px;
    min-height:104px;
    text-align:left;
    font-family:inherit;
    cursor:pointer;
    position:relative;
    color:inherit;
  }
  .sec-card-icon{
    width:34px; height:34px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface-2);
    color:var(--gold);
    flex-shrink:0;
  }
  .sec-card-icon svg{width:17px;height:17px;}
  .ico{display:inline-flex;vertical-align:-3px;width:15px;height:15px;margin-right:5px;}
  .ico svg{width:100%;height:100%;}
  .eye-x svg{width:17px;height:17px;}
  .sec-card-label{
    font-weight:700;
    font-size:calc(13.5px * var(--font-scale, 1));
    letter-spacing:-0.1px;
  }
  .sec-card-stat{
    font-size:calc(10.5px * var(--font-scale, 1));
    color:var(--muted);
    margin-top:-8px;
  }
  .back-btn{
    width:30px; height:30px;
    border-radius:9px;
    background:var(--surface);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--cream);
    font-size:14px;
    flex-shrink:0;
  }
  .live-dot{
    position:absolute;
    top:12px; right:12px;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--rose);
    box-shadow:0 0 0 3px rgba(214,64,42,0.25);
  }
  .live-dot::after{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    background:var(--rose);
    animation:live-pulse 1.6s infinite;
  }
  @keyframes live-pulse{
    0%{opacity:.7;transform:scale(1);}
    100%{opacity:0;transform:scale(2.4);}
  }
  @media (prefers-reduced-motion: reduce){
    .live-dot::after{animation:none;}
  }
  .card-nova{
    background:rgba(232,166,60,0.08);
    border-color:var(--gold);
  }
  .card-especial{
    background:rgba(124,156,240,0.1);
    border-color:#7C9CF0;
  }
  .empty{
    text-align:center;
    padding:36px 16px;
    color:var(--muted);
    font-size:calc(14px * var(--font-scale, 1));
    border:1px dashed var(--line);
    border-radius:var(--radius);
  }

  .agenda-card{
    display:flex;
    background:var(--surface);
    border:1px solid var(--line);
    border-left:4px solid var(--agenda-accent, var(--gold));
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
  }
  .agenda-daynum{
    flex:0 0 auto;
    width:78px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:calc(38px * var(--font-scale, 1));
    color:var(--agenda-accent, var(--gold));
    line-height:1;
    padding:14px 6px;
  }
  .agenda-month{
    font-weight:700;
    font-size:calc(12px * var(--font-scale, 1));
    letter-spacing:1px;
    margin-top:4px;
  }
  .agenda-body{
    flex:1 1 auto;
    min-width:0;
    padding:14px 14px 14px 0;
  }
  .agenda-toprow{
    display:flex;
    align-items:center;
    gap:10px;
    padding-bottom:10px;
    margin-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .agenda-weekday{
    font-weight:700;
    font-size:calc(15px * var(--font-scale, 1));
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--agenda-accent, var(--gold));
  }
  .agenda-badge{
    margin-left:auto;
    border:1px solid var(--line);
    border-radius:20px;
    padding:4px 12px;
    font-size:calc(12px * var(--font-scale, 1));
    color:var(--muted);
    white-space:nowrap;
  }
  .agenda-mainrow{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .agenda-time{
    color:var(--muted);
    font-weight:600;
    font-size:calc(14px * var(--font-scale, 1));
    flex:0 0 auto;
  }
  .agenda-title{
    font-weight:700;
    font-size:calc(16px * var(--font-scale, 1));
    flex:1 1 auto;
    min-width:120px;
  }
  .agenda-tags{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
  }
  .agenda-tag{
    background:rgba(240,169,60,0.15);
    color:var(--gold);
    border-radius:20px;
    padding:4px 12px;
    font-size:calc(12px * var(--font-scale, 1));
    font-weight:700;
  }
  .empty .note-dot{margin-bottom:8px;}

  form.inline-add{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  input[type=text], input[type=date], select{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--cream);
    border-radius:10px;
    padding:11px 12px;
    font-size:calc(15px * var(--font-scale, 1));
    font-family:var(--font);
    outline:none;
    width:100%;
  }
  input::placeholder{color:var(--muted);}
  input[type=text]:focus, input[type=date]:focus, select:focus{border-color:var(--gold);}

  button{
    font-family:var(--font);
    cursor:pointer;
    border:none;
  }
  .btn-add{
    background:var(--gold);
    color:var(--bg);
    font-weight:700;
    width:46px;
    border-radius:10px;
    font-size:calc(20px * var(--font-scale, 1));
    flex-shrink:0;
  }
  .btn-add:active{transform:scale(0.95);}

  .member-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .member-name{
    font-weight:600;
    font-size:calc(15.5px * var(--font-scale, 1));
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    cursor:pointer;
    border-bottom:1px dashed transparent;
  }
  .member-name:hover{border-bottom:1px dashed var(--muted);}
  .confirm-dot{
    width:11px;height:11px;border-radius:50%;
    flex-shrink:0;
    border:2px solid var(--muted);
    background:transparent;
    padding:0;
    cursor:pointer;
  }
  .confirm-dot.confirmed{
    background:var(--green);
    border-color:var(--green);
  }
  .edit-nome-input{
    flex:1;
    min-width:0;
    font-weight:600;
    font-size:calc(15.5px * var(--font-scale, 1));
    padding:6px 8px;
  }
  .btn-save-nome{
    flex-shrink:0;
    background:var(--gold);
    color:var(--bg);
    font-weight:700;
    width:32px;
    height:32px;
    border-radius:8px;
    font-size:calc(15px * var(--font-scale, 1));
  }
  .pay-toggle{
    flex-shrink:0;
    border-radius:10px;
    padding:9px 12px;
    font-size:calc(12.5px * var(--font-scale, 1));
    font-weight:600;
    background:var(--surface-2);
    color:var(--rose);
    border:1px solid rgba(214,64,42,0.4);
    white-space:nowrap;
  }
  .pay-toggle.paid{
    background:rgba(127,168,94,0.15);
    color:var(--green);
    border:1px solid rgba(127,168,94,0.4);
  }
  .stepper-label{display:block;color:var(--muted);font-size:calc(12px * var(--font-scale, 1));margin-bottom:6px;}
  .stepper-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .stepper-btn{
    flex-shrink:0;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--cream);
    border-radius:10px;
    padding:10px 14px;
    font-weight:700;
    font-size:calc(13px * var(--font-scale, 1));
  }
  .stepper-value{
    flex:1;
    text-align:center;
    font-weight:800;
    font-size:calc(20px * var(--font-scale, 1));
    color:var(--gold);
  }
  .btn-urgente{
    width:100%;
    margin-top:10px;
    background:rgba(214,64,42,0.15);
    color:var(--rose);
    border:1px solid rgba(214,64,42,0.5);
    border-radius:12px;
    padding:12px;
    font-weight:700;
    font-size:calc(14px * var(--font-scale, 1));
  }
  .ring-timer{
    position:relative;
    width:min(180px, 55vw);
    height:min(180px, 55vw);
    margin:8px auto;
  }
  .ring-timer svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-bg{fill:none;stroke:rgba(244,238,225,0.1);stroke-width:8;}
  .ring-progress{
    fill:none;
    stroke:var(--rose);
    stroke-width:8;
    stroke-linecap:round;
    transition:stroke-dashoffset 1s linear;
  }
  .ring-center{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ring-time{
    font-family:var(--font);
    font-weight:800;
    font-size:calc(30px * var(--font-scale, 1));
    color:var(--cream);
  }
  .aovivo-timer{font-family:var(--font);font-weight:800;font-size:calc(30px * var(--font-scale, 1));}
  .aovivo-timer.esgotado{color:var(--rose);}
  .del-x{
    flex-shrink:0;
    background:transparent;
    color:var(--muted);
    font-size:calc(16px * var(--font-scale, 1));
    width:22px;
    line-height:1;
  }
  .edit-x{
    flex-shrink:0;
    background:transparent;
    color:var(--muted);
    font-size:calc(15px * var(--font-scale, 1));
    width:22px;
    line-height:1;
  }
  .eye-x{
    flex-shrink:0;
    background:transparent;
    color:var(--muted);
    font-size:calc(15px * var(--font-scale, 1));
    width:22px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .eye-x.hidden-item{color:var(--rose);}
  .reorder-btn{
    flex-shrink:0;
    background:transparent;
    color:var(--muted);
    font-size:calc(10px * var(--font-scale, 1));
    width:18px;
    line-height:1.2;
    padding:2px 0;
  }
  .reorder-btn:disabled{opacity:0.25;cursor:default;}
  .reorder-btn:not(:disabled):hover{color:var(--gold);}
  .card.item-hidden{opacity:0.5;}
  .member-sub{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--line);
    font-size:calc(12px * var(--font-scale, 1));
    color:var(--muted);
  }

  .gender-select{
    width:88px;
    flex:0 0 auto;
    padding:11px 8px;
    font-size:calc(13px * var(--font-scale, 1));
  }
  .import-gender-select{
    width:100%;
    margin-bottom:10px;
  }
  .link-btn{
    background:transparent;
    color:var(--gold);
    font-size:calc(13px * var(--font-scale, 1));
    font-weight:600;
    padding:4px 2px 14px 2px;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .import-box{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:16px;
  }
  .import-box textarea{
    width:100%;
    min-height:110px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--cream);
    border-radius:10px;
    padding:11px 12px;
    font-size:calc(14px * var(--font-scale, 1));
    font-family:var(--font);
    outline:none;
    resize:vertical;
    margin-bottom:10px;
  }
  .import-box textarea:focus{border-color:var(--gold);}
  .btn-import{
    background:var(--gold);
    color:var(--bg);
    font-weight:700;
    width:100%;
    border-radius:10px;
    padding:11px;
    font-size:calc(14px * var(--font-scale, 1));
  }
  .btn-import:active{transform:scale(0.98);}

  .check-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:calc(13.5px * var(--font-scale, 1));
    color:var(--muted);
    margin-bottom:14px;
    cursor:pointer;
  }
  .check-row input, .check-row-inline input{
    accent-color:var(--gold);
    width:15px;
    height:15px;
  }
  .check-row-inline{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:calc(11.5px * var(--font-scale, 1));
    color:var(--muted);
    cursor:pointer;
    white-space:nowrap;
  }
  .inst-tag{
    font-size:calc(10.5px * var(--font-scale, 1));
    font-weight:700;
    color:var(--gold);
    background:rgba(240,169,60,0.12);
    padding:2px 7px;
    border-radius:8px;
    white-space:nowrap;
  }
  .gender-fix-select{
    background:transparent;
    border:none;
    color:var(--gold);
    font-size:calc(12px * var(--font-scale, 1));
    font-weight:600;
    padding:0;
  }
  .stat-row{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  .stat{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
  }
  .stat .num{font-family:var(--font);font-size:calc(22px * var(--font-scale, 1));font-weight:700;}
  .stat .lbl{font-size:calc(11px * var(--font-scale, 1));color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}

  .song-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .song-name{flex:1;min-width:0;cursor:pointer;}
  .song-title{font-weight:600;font-size:calc(15px * var(--font-scale, 1));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .badge-nova{
    display:inline-block;
    background:linear-gradient(135deg, var(--gold), #d97a24);
    color:#241200;
    font-size:calc(9.5px * var(--font-scale, 1));
    font-weight:800;
    letter-spacing:0.5px;
    border-radius:6px;
    padding:2px 6px;
    vertical-align:middle;
    margin-right:2px;
  }
  .badge-especial{
    display:inline-block;
    background:linear-gradient(135deg, #7C9CF0, #5570d1);
    color:#0d1440;
    font-size:calc(9.5px * var(--font-scale, 1));
    font-weight:800;
    letter-spacing:0.5px;
    border-radius:6px;
    padding:2px 6px;
    vertical-align:middle;
    margin-right:2px;
  }
  .song-num{flex-shrink:0;color:var(--muted);font-weight:600;font-size:calc(13px * var(--font-scale, 1));width:20px;text-align:right;}
  .song-artist{font-weight:400;font-size:calc(12px * var(--font-scale, 1));color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
  .status-pill{
    flex-shrink:0;
    border:1px solid transparent;
    border-radius:20px;
    padding:7px 13px;
    font-size:calc(12px * var(--font-scale, 1));
    font-weight:600;
    white-space:nowrap;
  }
  .card-nova .status-pill{
    border-color:rgba(232,166,60,0.55);
  }
  .status-aprender{background:rgba(214,64,42,0.15);color:var(--rose);}
  .status-ensaiando{background:rgba(240,169,60,0.15);color:var(--gold);}
  .status-pronta{background:rgba(127,168,94,0.15);color:var(--green);}
  .lyrics-box{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .lyrics-text{
    white-space:pre-wrap;
    font-size:calc(14px * var(--font-scale, 1));
    line-height:1.6;
    color:var(--cream);
  }
  .lyrics-textarea{
    width:100%;
    min-height:160px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--cream);
    border-radius:10px;
    padding:11px 12px;
    font-size:calc(14px * var(--font-scale, 1));
    font-family:var(--font);
    outline:none;
    resize:vertical;
    margin-bottom:10px;
  }
  .lyrics-textarea:focus{border-color:var(--gold);}
  .video-frame{
    position:relative;
    width:100%;
    max-width:320px;
    margin:0 auto;
    padding-top:177.78%;
    border-radius:10px;
    overflow:hidden;
    background:#000;
  }
  .video-frame iframe{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    border:none;
  }
  .video-frame-auto{
    position:relative;
    width:100%;
    max-width:480px;
    margin:0 auto 14px;
    aspect-ratio:16/9;
    border-radius:10px;
    overflow:hidden;
    background:#000;
  }
  .video-frame-auto iframe{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    border:none;
  }
  .audio-frame{
    width:100%;
    height:80px;
    border-radius:10px;
    overflow:hidden;
    background:var(--surface-2);
    margin-bottom:12px;
  }
  .audio-frame iframe{
    width:100%;
    height:100%;
    border:none;
  }

  .roteiro-card{padding:0;overflow:hidden;}
  .roteiro-head{
    padding:15px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;

    return [...grupos.filter(g => g.itens.length > 0), ...(semCategoria.length > 0 ? [{ key: "Sem categoria", cor: "var(--muted)", itens: semCategoria }] : [])];
  }
  function extrairDriveId(texto){
    const limpo = String(texto).trim();
    const match = limpo.match(/\/d\/([a-zA-Z0-9_-]+)/) || limpo.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if(match) return match[1];
    if(/^[a-zA-Z0-9_-]{10,}$/.test(limpo)) return limpo;
    return null;
  }
  function extrairYoutubeId(texto){
    const limpo = String(texto).trim();
    const match = limpo.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([a-zA-Z0-9_-]{11})/);
    return match ? match[1] : null;
  }
  function renderVideoLink(link, frameId){
    if(!link) return "";
    const youtubeId = extrairYoutubeId(link);
    if(youtubeId) return `<div class="video-frame-auto" id="${frameId}" data-youtube-id="${youtubeId}"><iframe src="https://www.youtube.com/embed/${youtubeId}" allow="autoplay" allowfullscreen></iframe></div>`;
    const driveId = extrairDriveId(link);
    if(driveId) return `<div class="video-frame-auto" id="${frameId}"><iframe src="https://drive.google.com/file/d/${driveId}/preview" allow="autoplay" allowfullscreen></iframe></div>`;
    return "";
  }

  async function ajustarProporcaoVideos(){
    document.querySelectorAll(".video-frame-auto[data-youtube-id]").forEach(async el => {
      if(el.dataset.resolvido) return;

      const youtubeId = el.dataset.youtubeId;
      try{
        const res = await fetch(`https://www.youtube.com/oembed?url=https://youtu.be/${youtubeId}&format=json`);
        if(!res.ok) return;
        const info = await res.json();
        if(info.width && info.height) el.style.aspectRatio = `${info.width} / ${info.height}`;

  }

  function slugify(s){
    return String(s).trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function normalizarBusca(s){
    return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  }
  function computeOrdemAlfabetica(nome){
    const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    const n = norm(nome);
    const lista = [...data.musicas].sort((a,b) => (a.ordem ?? 0) - (b.ordem ?? 0));
    let insertIdx = lista.findIndex(m => norm(m.nome) > n);
    if(insertIdx === -1) insertIdx = lista.length;
    const prev = lista[insertIdx - 1];
    const next = lista[insertIdx];
    const prevOrdem = prev ? (prev.ordem ?? 0) : (next ? (next.ordem ?? 1) - 1 : 0);
    const nextOrdem = next ? (next.ordem ?? prevOrdem + 1) : prevOrdem + 1;
    return (prevOrdem + nextOrdem) / 2;
  }

  function formatLyrics(s){
    return escapeHtml(s)
      .replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(?<!\*)\*(?!\*)([\s\S]+?)(?<!\*)\*(?!\*)/g, "<em>$1</em>");
  }

  function capturarAudioTocando(){
    const audios = document.querySelectorAll("audio[data-audio-id]");
    for(const a of audios){
      if(!a.paused) return { id: a.dataset.audioId, time: a.currentTime };
    }
    return null;
  }

  function restaurarAudioTocando(state){
    if(!state) return;
    document.querySelectorAll(`audio[data-audio-id="${state.id}"]`).forEach(a => {
      a.currentTime = state.time;
      a.play().catch(() => {});
    });
  }

  function capturarFocoInput(){
    const el = document.activeElement;
    if(!el || !el.id || !["INPUT","TEXTAREA","SELECT"].includes(el.tagName)) return null;
    return { id: el.id, value: el.value, selStart: el.selectionStart, selEnd: el.selectionEnd };
  }

  function restaurarFocoInput(state){
    if(!state) return;
    const el = document.getElementById(state.id);
    if(!el) return;
    el.value = state.value;
    el.focus();
    if(typeof state.selStart === "number" && el.setSelectionRange){
      try{ el.setSelectionRange(state.selStart, state.selEnd); }catch(e){}
    }
  }

    const totalTaxaPaga = data.integrantes.filter(i => i.taxaEquipe).length;
    const valorTaxaCompleto = (data.configFinanceiro?.valorTaxa || 0) + (data.configFinanceiro?.valorCamisa || 0);

        ${ofertasExpandido ? `
          <div style="text-align:left;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);">
            ${[...data.integrantes].filter(i => i.oferta > 0).sort((a,b) => b.oferta - a.oferta).map(i => `
              <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:calc(14px * var(--font-scale, 1));">
                <span>${escapeHtml(i.nome)}</span>
                <span style="color:var(--green);font-weight:600;">${formatMoeda(i.oferta)}</span>
              </div>
            `).join("") || `<span style="color:var(--muted);">Ninguém deu oferta ainda.</span>`}
          </div>
        ` : ""}
      </div>
      ${data.configFinanceiro?.valorCamisa > 0 ? `
        <div class="card" style="text-align:center;margin-bottom:16px;">
          <div style="font-size:calc(12px * var(--font-scale, 1));color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;"><span class="ico">${ICONS.camisa}</span>Despesa com camisas (estimativa)</div>
          <div style="font-size:calc(24px * var(--font-scale, 1));font-weight:800;color:var(--rose);">${formatMoeda(totalIntegrantes * data.configFinanceiro.valorCamisa)}</div>
          <div style="color:var(--muted);font-size:calc(12px * var(--font-scale, 1));margin-top:4px;">${totalIntegrantes} integrantes × ${formatMoeda(data.configFinanceiro.valorCamisa)} — atualiza sozinho conforme a equipe muda</div>
        </div>
      ` : ""}
      <form class="inline-add" id="form-financeiro" style="flex-wrap:wrap;">
        <div style="display:flex;gap:8px;width:100%;">
          <button type="button" class="pay-toggle ${finTipoForm === "receita" ? "paid" : ""}" data-action="fin-tipo-form" data-tipo="receita" style="flex:1;font-size:calc(16.5px * var(--font-scale, 1));">Receita</button>
          <button type="button" class="pay-toggle ${finTipoForm === "despesa" ? "paid" : ""}" data-action="fin-tipo-form" data-tipo="despesa" style="flex:1;font-size:calc(16.5px * var(--font-scale, 1));">Despesa</button>
        </div>
        <input type="text" id="input-fin-descricao" placeholder="Nome da ${finTipoForm === "receita" ? "receita" : "despesa"} (ex: Refrigerante do ensaio)" required style="flex:2 1 200px;" />
        <input type="text" inputmode="decimal" id="input-fin-valor" placeholder="Valor (ex: 5*32)" required style="flex:1 1 100px;font-size:calc(22px * var(--font-scale, 1));font-weight:700;" />
        <input type="date" id="input-fin-data" required value="${new Date().toISOString().slice(0,10)}" style="flex:1 1 140px;" />
        <button type="submit" class="btn-add" style="font-size:calc(24px * var(--font-scale, 1));">+</button>
      </form>
      ${data.configFinanceiro?.valorCamisa > 0 ? `
        <button type="button" class="link-btn" style="padding:0 0 16px;font-size:calc(13px * var(--font-scale, 1));" data-action="preencher-despesa-camisas">
          <span class="ico">${ICONS.camisa}</span>Lançar essa estimativa como despesa agora
        </button>
      ` : ""}
    `;

    if(transacoes.length === 0){
      html += `<div class="empty" style="font-size:calc(18px * var(--font-scale, 1));"><div class="note-dot"></div><br>Nenhuma movimentação registrada ainda.</div>`;
    } else {
      html += transacoes.map(t => {
        const unitario = t.tipo === "despesa" && totalIntegrantes > 0 ? t.valor / totalIntegrantes : null;
        if(editingFinanceiroId === t.id){
          return `
          <div class="card" style="padding:12px 14px;">
            <div style="display:flex;gap:8px;margin-bottom:8px;">
              <input type="text" class="edit-nome-input" id="input-edit-fin-descricao" data-id="${t.id}" value="${escapeHtml(t.descricao)}" placeholder="Descrição" style="flex:1;" />
            </div>
            <div style="display:flex;gap:8px;">
              <input type="text" inputmode="decimal" class="edit-nome-input" id="input-edit-fin-valor" data-id="${t.id}" value="${t.valor}" placeholder="Valor" style="flex:1;" />
              <input type="date" class="edit-nome-input" id="input-edit-fin-data" data-id="${t.id}" value="${t.data}" style="flex:1;" />
            </div>
            <div style="display:flex;gap:8px;margin-top:10px;">
              <button class="btn-save-nome" style="width:auto;flex:1;padding:0 14px;" data-action="save-financeiro" data-id="${t.id}">Salvar</button>
              <button class="del-x" style="width:auto;padding:0 14px;border:1px solid var(--line);border-radius:10px;" data-action="cancel-edit-financeiro">Cancelar</button>
            </div>
          </div>
        `;
        }
        return `
        <div class="card" style="padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <div style="min-width:0;">
            <div style="font-weight:600;font-size:calc(19px * var(--font-scale, 1));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(t.descricao)}</div>
            <div style="color:var(--muted);font-size:calc(15px * var(--font-scale, 1));">${formatDate(t.data)}${unitario !== null ? ` · ${formatMoeda(unitario)}/pessoa` : ""}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
            <span style="font-weight:700;font-size:calc(19px * var(--font-scale, 1));color:${t.tipo === "receita" ? "var(--green)" : "var(--rose)"};">${t.tipo === "receita" ? "+" : "-"}${formatMoeda(t.valor)}</span>
            <button class="edit-x" style="width:34px;height:34px;font-size:calc(19px * var(--font-scale, 1));display:flex;align-items:center;justify-content:center;" data-action="edit-financeiro" data-id="${t.id}" title="Editar">✎</button>
            <button class="del-x" data-action="del-financeiro" data-id="${t.id}">✕</button>
          </div>
        </div>
      `;
      }).join("");
    }
    return html;
  }

  function renderIntegrantes(){
    const total = data.integrantes.length;
    const totalHomens = data.integrantes.filter(i => i.genero === "M").length;
    const totalMulheres = data.integrantes.filter(i => i.genero === "F").length;
    const totalInstrumental = data.integrantes.filter(i => i.instrumental).length;
    const totalConfirmados = data.integrantes.filter(i => i.confirmado).length;

    let html = `
      <div class="stat-row">
        <div class="stat"><div class="num">${total}</div><div class="lbl">Integrantes (${totalHomens}H · ${totalMulheres}M)</div></div>
        <div class="stat"><div class="num">${totalInstrumental}</div><div class="lbl">Instrumental</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:16px;color:var(--muted);font-size:calc(12px * var(--font-scale, 1));margin:0 2px 14px 2px;">
        <span style="display:flex;align-items:center;gap:6px;"><span class="confirm-dot confirmed" style="cursor:default;"></span>Confirmado (${totalConfirmados})</span>
        <span style="display:flex;align-items:center;gap:6px;"><span class="confirm-dot" style="cursor:default;"></span>A convidar (${total - totalConfirmados})</span>
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;">
        <button type="button" id="btn-relatorio-pdf" class="link-btn"><span class="ico">${ICONS.printer}</span>Gerar relatório em PDF</button>
        <button type="button" id="btn-relatorio-excel" class="link-btn"><span class="ico">${ICONS.cloud}</span>Gerar relatório em Excel</button>
      </div>
      <form class="inline-add" id="form-integrante">
        <input type="text" id="input-integrante-nome" placeholder="Nome do integrante" required />
        <select id="input-integrante-genero" class="gender-select" required>
          <option value="">Sexo</option>
          <option value="M">Homem</option>
          <option value="F">Mulher</option>
        </select>
        <button type="submit" class="btn-add">+</button>
      </form>
      <label class="check-row">
        <input type="checkbox" id="input-integrante-instrumental" />
        Toca instrumento (Instrumental)
      </label>
      <button type="button" id="btn-toggle-import" class="link-btn">${importOpen ? "Cancelar importação" : "Colar lista de nomes"}</button>
      <div class="import-box ${importOpen ? "" : "hidden"}">
        <textarea id="input-import-nomes" placeholder="Cole aqui um nome por linha (ou separados por vírgula)"></textarea>
        <select id="input-import-genero" class="import-gender-select" required>
          <option value="">Esses nomes são de...</option>
          <option value="M">Homens</option>
          <option value="F">Mulheres</option>
        </select>
        <label class="check-row">
          <input type="checkbox" id="input-import-instrumental" />
          Todos esses são do Instrumental
        </label>
        <button type="button" id="btn-import-nomes" class="btn-import">Importar nomes</button>
      </div>
    `;

    if(total === 0){
      html += `<div class="empty"><div class="note-dot"></div><br>Nenhum integrante ainda.<br>Adicione o primeiro nome acima.</div>`;
    } else {
      const totalTaxaPaga = data.integrantes.filter(i => i.taxaEquipe).length;
      const totalCamisaDefinida = data.integrantes.filter(i => i.camisaDefinida).length;
      html += `
        <div class="section-title" style="margin-top:0;display:flex;align-items:center;gap:8px;">
          <span>Filtrar por Taxa da Equipe</span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
          <button type="button" class="pay-toggle ${!filtroTaxaIntegrantes ? "paid" : ""}" data-action="filtrar-taxa-integrantes" data-valor="">Todos (${total})</button>
          <button type="button" class="pay-toggle ${filtroTaxaIntegrantes === "pago" ? "paid" : ""}" data-action="filtrar-taxa-integrantes" data-valor="pago">Pagou (${totalTaxaPaga})</button>
          <button type="button" class="pay-toggle ${filtroTaxaIntegrantes === "pendente" ? "paid" : ""}" data-action="filtrar-taxa-integrantes" data-valor="pendente">Não pagou (${total - totalTaxaPaga})</button>
        </div>
        <div class="section-title" style="margin-top:0;display:flex;align-items:center;gap:8px;">
          <span>Filtrar por Camisa</span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:${filtroCamisaIntegrantes ? "10px" : "16px"};">
          <button type="button" class="pay-toggle ${!filtroCamisaIntegrantes ? "paid" : ""}" data-action="filtrar-camisa-integrantes" data-valor="">Todos (${total})</button>
          <button type="button" class="pay-toggle ${filtroCamisaIntegrantes === "definida" ? "paid" : ""}" data-action="filtrar-camisa-integrantes" data-valor="definida">Definiu (${totalCamisaDefinida})</button>
          <button type="button" class="pay-toggle ${filtroCamisaIntegrantes === "pendente" ? "paid" : ""}" data-action="filtrar-camisa-integrantes" data-valor="pendente">Não definiu (${total - totalCamisaDefinida})</button>
        </div>
        ${filtroCamisaIntegrantes ? `
          <button type="button" class="link-btn" style="padding:0;margin-bottom:16px;color:#25D366;display:flex;align-items:center;gap:5px;" data-action="compartilhar-lista-camisa"><span class="ico" style="margin:0;">${ICONS.whatsapp}</span>Enviar lista pelo WhatsApp</button>
        ` : ""}
      `;
      const porNome = (a,b) => a.nome.localeCompare(b.nome, "pt-BR", { sensitivity: "base" });
      const filtrados = data.integrantes.filter(i => {
        if(filtroTaxaIntegrantes === "pago" && !i.taxaEquipe) return false;
        if(filtroTaxaIntegrantes === "pendente" && i.taxaEquipe) return false;
        if(filtroCamisaIntegrantes === "definida" && !i.camisaDefinida) return false;
        if(filtroCamisaIntegrantes === "pendente" && i.camisaDefinida) return false;
        return true;
      });
      const homens = filtrados.filter(i => i.genero === "M").sort(porNome);
      const mulheres = filtrados.filter(i => i.genero === "F").sort(porNome);
      const semGenero = filtrados.filter(i => i.genero !== "M" && i.genero !== "F").sort(porNome);
      const instrumental = filtrados.filter(i => i.instrumental).sort(porNome);

      if(filtrados.length === 0){
        html += `<div class="empty"><div class="note-dot"></div><br>Ninguém nesse filtro.</div>`;
      } else {
        html += renderGroup("homens", "Homens", homens, "var(--blue)");
        html += renderGroup("mulheres", "Mulheres", mulheres, "var(--rose)");
        if(semGenero.length > 0) html += renderGroup("semGenero", "Sem sexo definido", semGenero, "var(--muted)");
        html += renderGroup("instrumental", "Instrumental", instrumental, "var(--gold)");
      }
    }
    return html;
  }

  function renderGroup(key, titulo, lista, color){
    if(lista.length === 0) return "";
    const collapsed = !!collapsedGroups[key];
    let html = `
      <div class="section-title" data-action="toggle-group" data-group="${key}">
        <span class="note-dot" style="background:${color}"></span>${titulo} <span style="color:var(--muted);font-weight:400;font-size:calc(14px * var(--font-scale, 1));">(${lista.length})</span>
        <span class="chevron ${collapsed?"":"open"}">▶</span>
      </div>
      <div class="${collapsed?"hidden":""}">`;
    const hojeIso = new Date().toISOString().slice(0,10);
    const sessoesRealizadas = data.historico.filter(s => s.data <= hojeIso);
    const totalSessoes = sessoesRealizadas.length;
    html += lista.map(i => {
      const presencas = sessoesRealizadas.filter(s => (s.presentes || []).includes(i.nome)).length;
      const faltas = totalSessoes - presencas;
      return `
      <div class="card" data-id="${i.id}" style="border-left:3px solid ${color};">
        <div class="member-row">
          <button class="confirm-dot ${i.confirmado ? "confirmed" : ""}" data-action="toggle-confirmado" data-id="${i.id}" title="${i.confirmado ? "Confirmado — toque para desmarcar" : "A convidar — toque para confirmar"}"></button>
          ${editingNameId === i.id ? `
            <input type="text" class="edit-nome-input" data-id="${i.id}" value="${escapeHtml(i.nome)}" />
            <button class="btn-save-nome" data-action="save-nome" data-id="${i.id}">✓</button>
          ` : `
            <div class="member-name" data-action="toggle-membro" data-id="${i.id}" title="Toque para ver detalhes">
              ${escapeHtml(i.nome)}${i.instrumental ? ` <span class="inst-tag"><span class="ico" style="margin-right:3px;">${ICONS.instrument}</span>Instrumental</span>` : ""}
              ${totalSessoes > 0 ? `<span style="font-family:var(--font);color:${faltas > 0 ? "var(--rose)" : "var(--green)"};font-size:calc(14.5px * var(--font-scale, 1));font-weight:600;margin-left:6px;">${presencas}/${totalSessoes}</span>` : ""}
            </div>
          `}
          ${editingNameId === i.id ? "" : `<button class="eye-x" style="color:${i.camisaDefinida ? "var(--green)" : "var(--muted)"};" data-action="toggle-camisa-definida" data-id="${i.id}" title="${i.camisaDefinida ? "Camisa definida — toque para desmarcar" : "Toque quando definir a camisa"}">${ICONS.camisaSolid}</button>`}
          ${editingNameId === i.id ? "" : `<button class="edit-x" data-action="edit-nome" data-id="${i.id}" title="Editar nome">✎</button>`}
          <button class="del-x" data-action="del-integrante" data-id="${i.id}">✕</button>
        </div>
        <div class="member-sub ${expandedMemberId === i.id ? "" : "hidden"}" style="flex-direction:column;align-items:stretch;gap:8px;">
          ${totalSessoes > 0 ? `<span>Presença: ${presencas} de ${totalSessoes} ensaio${totalSessoes === 1 ? "" : "s"} (${Math.round(presencas / totalSessoes * 100)}%)</span>` : `<span style="color:var(--muted);">Nenhum ensaio com chamada registrada ainda.</span>`}
          <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
            <button class="pay-toggle ${i.inscricao?"paid":""}" data-action="toggle-inscricao" data-id="${i.id}">Inscrição ${i.inscricao ? "✓" : ""}</button>
            <button class="pay-toggle ${i.taxaEquipe?"paid":""}" data-action="toggle-taxa" data-id="${i.id}">Taxa da Equipe ${i.taxaEquipe ? "✓" : ""}</button>
            ${editingOfertaId === i.id ? `
              <input type="text" inputmode="decimal" class="edit-nome-input" id="input-edit-oferta" data-id="${i.id}" value="${i.oferta || ""}" placeholder="Valor da oferta" style="width:110px;flex:0 0 auto;" />
              <button class="btn-save-nome" style="width:auto;padding:0 10px;" data-action="save-oferta" data-id="${i.id}">✓</button>
            ` : `
              <button class="pay-toggle ${i.oferta > 0 ? "paid" : ""}" data-action="edit-oferta" data-id="${i.id}">Oferta${i.oferta > 0 ? `: ${formatMoeda(i.oferta)}` : ""}</button>
            `}
          </div>
          <span style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
            <label class="check-row-inline">
              <input type="checkbox" data-action="toggle-instrumental" data-id="${i.id}" ${i.instrumental?"checked":""} /> Instrumental
            </label>
            <select class="gender-fix-select" data-action="fix-gender" data-id="${i.id}">
              <option value="" ${!i.genero?"selected":""}>Sexo?</option>
              <option value="M" ${i.genero==="M"?"selected":""}>Homem</option>
              <option value="F" ${i.genero==="F"?"selected":""}>Mulher</option>
            </select>
          </span>
        </div>
      </div>`;
    }).join("");
    html += `</div>`;
    return html;
  }

  function renderMusicas(){
    const totalReal = data.musicas.length;
    const musicasVisiveis = data.musicas.filter(m => m.visivel !== false);
    const total = musicasVisiveis.length;
    const prontas = musicasVisiveis.filter(m => m.status === "pronta").length;
    const pendentesDrive = data.musicas.filter(m => m.audioId && !m.audioUrl).length;
    let html = `
      <div class="stat-row">
        <div class="stat"><div class="num">${total}</div><div class="lbl">Músicas</div></div>
        <div class="stat"><div class="num">${prontas}/${total}</div><div class="lbl">Prontas</div></div>
      </div>
      ${pendentesDrive > 0 ? `
        <button type="button" id="btn-migrar-audios" class="btn-import" style="margin-bottom:16px;background:var(--gold);color:#241200;" ${migrandoAudios ? "disabled" : ""}>${migrandoAudios ? "Migrando..." : `<span class="ico">${ICONS.cloud}</span>Migrar ${pendentesDrive} áudio${pendentesDrive === 1 ? "" : "s"} do Drive para o Storage`}</button>
      ` : ""}
      <form class="inline-add" id="form-musica" style="flex-wrap:wrap;">
        <input type="text" id="input-musica-nome" placeholder="Nome da música" required style="flex:1 1 180px;" />
        <label class="check-row" style="flex:0 0 auto;gap:6px;">
          <input type="checkbox" id="input-musica-nova" />
          Nova
        </label>
        <select id="input-musica-categoria" style="flex:1 1 180px;">
          <option value="">Sem categoria</option>
          ${CATEGORIAS_MUSICA.map(c => `<option value="${escapeHtml(c.key)}">${escapeHtml(c.key)}</option>`).join("")}
        </select>
        <label class="check-row" style="flex:0 0 auto;gap:6px;">
          <input type="checkbox" id="input-musica-oculta" />
          Adicionar oculta
        </label>
        <button type="submit" class="btn-add">+</button>
      </form>
      ${totalReal > 0 ? `
        <input type="text" id="input-busca-musicas" placeholder="Buscar por título ou artista..." value="${escapeHtml(buscaMusicas)}" style="margin-bottom:10px;" />
        <label class="check-row">
          <input type="checkbox" id="input-mostrar-ocultas" ${mostrarOcultasMusicas ? "checked" : ""} />
          Mostrar músicas ocultas
        </label>
      ` : ""}
    `;
    if(totalReal === 0){
      html += `<div class="empty"><div class="note-dot"></div><br>Nenhuma música na lista.<br>Adicione as músicas para ensaiar.</div>`;
    } else {
      const termo = normalizarBusca(buscaMusicas.trim());
      const filtradas = data.musicas
        .filter(m => mostrarOcultasMusicas || m.visivel !== false)
        .filter(m => !termo || normalizarBusca(m.nome).includes(termo));
      if(filtradas.length === 0){
        html += termo
          ? `<div class="empty"><div class="note-dot"></div><br>Nenhuma música encontrada para "${escapeHtml(buscaMusicas)}".</div>`
          : `<div class="empty"><div class="note-dot"></div><br>Todas as músicas estão ocultas.<br>Marque "Mostrar músicas ocultas" acima pra vê-las.</div>`;
      }
      const grupos = CATEGORIAS_MUSICA.map(c => ({ ...c, itens: filtradas.filter(m => categoriaDaMusica(m) === c.key).sort(compararMusicas) }));
      const semCategoria = filtradas.filter(m => !categoriaDaMusica(m)).sort(compararMusicas);
      grupos.forEach(g => {
        if(g.itens.length === 0) return;
        const groupKey = "musicas-" + slugify(g.key);
        const collapsed = !!collapsedGroups[groupKey];
        html += `
          <div class="section-title" style="margin-top:0;" data-action="toggle-group" data-group="${groupKey}">
            <span class="note-dot" style="background:${g.cor}"></span>${escapeHtml(g.key)} <span style="color:var(--muted);font-weight:400;font-size:calc(14px * var(--font-scale, 1));">(${g.itens.length})</span>

          </div>
          <div class="${collapsed ? "hidden" : ""}">
            ${g.itens.map((m, idx) => renderCardMusica(m, idx, g.itens.length)).join("")}
          </div>
        `;
      });
      if(semCategoria.length > 0){
        const collapsed = !!collapsedGroups["musicas-sem-categoria"];
        html += `
          <div class="section-title" style="margin-top:0;" data-action="toggle-group" data-group="musicas-sem-categoria">
            <span class="note-dot" style="background:var(--muted)"></span>Sem categoria <span style="color:var(--muted);font-weight:400;font-size:calc(14px * var(--font-scale, 1));">(${semCategoria.length})</span>
            <span class="chevron ${collapsed?"":"open"}">▶</span>

          <div class="${collapsed ? "hidden" : ""}">
            ${semCategoria.map((m, idx) => renderCardMusica(m, idx, semCategoria.length)).join("")}
          </div>
        `;
      }
    }
    return html;
  }

  function renderCardMusica(m, idx, total){

      ${open ? `

                <option value="" ${!categoria ? "selected" : ""}>Sem categoria</option>

              </select>
            </label>
          </div>
          ${editingAudio ? `
            ${enviandoAudioId === m.id ? `

              <input type="file" accept="audio/*" id="input-audio-file" data-id="${m.id}" style="margin-bottom:8px;width:100%;" />

                ${(m.audioUrl || m.audioId) ? `<button type="button" class="link-btn" style="padding:0;color:var(--rose);" data-action="remover-audio" data-id="${m.id}">Remover áudio</button>` : ""}
                <button type="button" class="link-btn" style="padding:0;margin-left:auto;" data-action="cancelar-edit-audio">Cancelar</button>

          ` : `
            ${renderAudioPlayer(m)}

          ${editingLetra ? `
            <textarea class="lyrics-textarea" data-id="${m.id}">${escapeHtml(m.letra || "")}</textarea>
            <div style="color:var(--muted);font-size:calc(12px * var(--font-scale, 1));margin:-4px 0 10px 0;">Use **texto** para negrito e *texto* para itálico</div>

                <div class="item-activity">${escapeHtml(it.atividade)}</div>

            <form class="add-item-form" data-action="form-add-item" data-roteiro="${r.id}">
              <input type="text" placeholder="19h" class="item-horario-input" required />

  function formatDate(iso){
    const [y,m,d] = iso.split("-");
    return `${d}/${m}/${y}`;
  }

  function roteiroCountdown(r){
    if(!r.data) return null;
    const alvo = new Date(`${r.data}T${r.hora || "00:00"}:00`).getTime();
    const diffMin = Math.round((alvo - Date.now()) / 60000);
    if(diffMin <= 0) return null;
    const dias = Math.floor(diffMin / 1440);
    const horas = Math.floor((diffMin % 1440) / 60);
    const minutos = diffMin % 60;
    if(dias > 0) return `Faltam ${dias}d ${horas}h`;
    if(horas > 0) return `Faltam ${horas}h ${minutos}min`;
    return `Faltam ${minutos}min`;
  }

  function renderVisualizacoesBadge(tipo, itemId){
    const vistos = data.visualizacoes.filter(v => v.tipo === tipo && v.itemId === itemId);
    if(vistos.length === 0){
      return `<div style="color:var(--muted);font-size:calc(12px * var(--font-scale, 1));margin-bottom:10px;"><span class="ico">${ICONS.eye}</span>Ninguém visualizou ainda</div>`;
    }
    const nomes = vistos.map(v => escapeHtml(v.nome)).join(", ");
    return `<div style="color:var(--muted);font-size:calc(12px * var(--font-scale, 1));margin-bottom:10px;"><span class="ico">${ICONS.eye}</span>${vistos.length} visualiza${vistos.length===1?"ção":"ções"}: ${nomes}</div>`;
  }

  function agendaOrdenada(){
    return [...data.agenda].sort((a,b) => a.data.localeCompare(b.data));
  }

  function pickDefaultEnsaioData(){
    const hojeIso = new Date().toISOString().slice(0,10);
    const ordenada = agendaOrdenada();
    const futura = ordenada.find(a => a.data >= hojeIso);
    if(futura) return futura.data;
    if(ordenada.length > 0) return ordenada[ordenada.length - 1].data;
    const historicoOrdenado = [...data.historico].sort((a,b) => a.data.localeCompare(b.data));
    if(historicoOrdenado.length > 0) return historicoOrdenado[historicoOrdenado.length - 1].data;
    return hojeIso;
  }

  function getAgendaDoDia(dataIso){
    return data.agenda.find(a => a.data === dataIso) || null;
  }

  function datasEnsaioDisponiveis(){
    const agendaDatas = agendaOrdenada().map(a => a.data);
    const historicoDatas = [...data.historico].map(s => s.data).filter(d => !agendaDatas.includes(d));
    return [...agendaDatas, ...historicoDatas].sort();
  }

  function getPlanoDoDia(dataIso){
    const a = getAgendaDoDia(dataIso);
    let ids;
    if(a){
      ids = a.musicaIds || [];
    } else {
      const sessao = data.historico.find(s => s.data === dataIso);
      ids = sessao?.musicaIds || [];
    }
    return ids.map(id => data.musicas.find(m => m.id === id)).filter(Boolean);
  }

  function getEnsaiadasDoDia(dataIso){
    const sessao = data.historico.find(s => s.data === dataIso);
    return sessao?.musicaIds || [];
  }

  async function toggleEnsaiada(dataIso, musicaId){
    const sessao = data.historico.find(s => s.data === dataIso);
    const atuais = sessao?.musicaIds || [];
    const marcado = atuais.includes(musicaId);
    const novos = marcado ? atuais.filter(id => id !== musicaId) : [...atuais, musicaId];
    await setDoc(doc(historicoCol, dataIso), { data: dataIso, musicaIds: novos, presentes: sessao?.presentes || [] }, { merge: true });
    let maxData = null;
    data.historico.forEach(s => {
      const ids = s.data === dataIso ? novos : (s.musicaIds || []);
      if(ids.includes(musicaId) && (!maxData || s.data > maxData)) maxData = s.data;
    });
    if(!sessao && novos.includes(musicaId) && (!maxData || dataIso > maxData)) maxData = dataIso;
    await updateDoc(doc(musicasCol, musicaId), { ultimoEnsaio: maxData });
  }

  function renderModoEnsaio(){
    if(!ensaioData) ensaioData = pickDefaultEnsaioData();
    return ensaioModo === "slideshow" ? renderEnsaioSlideshow() : renderEnsaioLista();
  }

      <div class="section-title" style="margin-top:0;">Músicas do dia</div>
      ${plano.length === 0 ? `<div class="empty"><div class="note-dot"></div><br>Nenhuma música definida pra essa data ainda.</div>` : agruparMusicas(plano).map(g => `
        <div class="section-title" style="margin-top:0;font-size:calc(13px * var(--font-scale, 1));"><span class="note-dot" style="background:${g.cor}"></span>${escapeHtml(g.key)}</div>
        ${g.itens.map(mm => {

          ${g.itens.map(mm => `
            <label class="check-row">
              <input type="checkbox" data-action="adicionar-ao-plano" data-id="${mm.id}" />

        <button type="button" class="link-btn" style="padding-top:10px;" data-action="fechar-adicionar-musica-ensaio">Fechar</button>

  function renderEnsaioSlideshow(){
    const plano = getPlanoDoDia(ensaioData);
    if(plano.length === 0){
      ensaioModo = "lista";
      return renderEnsaioLista();

    if(ensaioIndex >= plano.length) ensaioIndex = plano.length - 1;
    if(ensaioIndex < 0) ensaioIndex = 0;
    const m = plano[ensaioIndex];
    const ensaiadas = getEnsaiadasDoDia(ensaioData);
    const ensaiada = ensaiadas.includes(m.id);
    const { titulo, artista } = splitMusica(m.nome);
    return `
      <div class="ensaio-top">
        <span class="ensaio-progress">${ensaioIndex + 1} / ${plano.length}</span>
        <div style="display:flex;gap:10px;align-items:center;">

          <button type="button" class="del-x" data-action="sair-ensaio">✕</button>
        </div>
      </div>
      <div class="ensaio-title">${escapeHtml(titulo)}</div>
      ${artista ? `<div class="ensaio-artist">${escapeHtml(artista)}</div>` : ""}
      ${renderAudioPlayer(m)}
      <label class="check-row" style="margin:12px 0;">

  const AGENDA_DIAS_SEMANA = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
  const AGENDA_MESES = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
  const AGENDA_CORES = ["var(--gold)","var(--rose)"];

  function agendaRelativo(iso, hojeIso){
    const diffMs = new Date(iso + "T00:00:00") - new Date(hojeIso + "T00:00:00");
    const dias = Math.round(diffMs / 86400000);
    if(dias === 0) return "hoje";
    if(dias === 1) return "amanhã";
    if(dias > 1) return `em ${dias} dias`;
    if(dias === -1) return "ontem";
    return `há ${Math.abs(dias)} dias`;
  }

  function montarTextoAgendaWhatsapp(a){
    const [y, m, d] = a.data.split("-");
    const weekday = AGENDA_DIAS_SEMANA[new Date(a.data + "T00:00:00").getDay()];
    const dataFormatada = `${weekday} - ${d}/${m}/${y}`;
    const tags = (a.tags || "").split(",").map(t => t.trim()).filter(Boolean);
    const musicas = (a.musicaIds || []).map(id => data.musicas.find(mm => mm.id === id)).filter(Boolean);
    let texto = `📅 *${a.titulo || "Encontro da Equipe"}*\n${dataFormatada}${a.hora ? ` às ${a.hora}` : ""}\n`;
    if(tags.length > 0) texto += `\n${tags.join(" · ")}\n`;
    if(musicas.length > 0){
      texto += `\n🎵 Músicas do dia:\n${musicas.map(mm => `- ${splitMusica(mm.nome).titulo}`).join("\n")}\n`;
    }
    return texto;
  }

  function renderRingTimer(restanteSeg, totalSeg){
    const r = 54;
    const c = 2 * Math.PI * r;
    const fracao = totalSeg > 0 ? Math.min(1, restanteSeg / totalSeg) : 0;
    const offset = c * (1 - fracao);
    const mm = String(Math.floor(restanteSeg / 60)).padStart(2, "0");
    const ss = String(restanteSeg % 60).padStart(2, "0");
    return `
      <div class="ring-timer">
        <svg viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="${r}"></circle>
          <circle class="ring-progress" cx="60" cy="60" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
        </svg>
        <div class="ring-center">
          <div class="ring-time">${mm}:${ss}</div>
        </div>
      </div>
    `;
  }

    html += `

      </div>

    html += renderSetlistHoje() + renderHistoricoAvisos();
    return html;
  }

  function renderAgenda(){
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const hojeIso = hoje.toISOString().slice(0,10);
    let html = `
      <form class="inline-add" id="form-agenda" style="flex-wrap:wrap;">
        <input type="date" id="input-agenda-data" required style="flex:0 0 150px;"/>
        <input type="time" id="input-agenda-hora" style="flex:0 0 110px;"/>
        <input type="text" id="input-agenda-titulo" placeholder="Título (ex: Culto da Família)" style="flex:1 1 200px;"/>
        <input type="text" id="input-agenda-tags" placeholder="Tags separadas por vírgula" style="flex:1 1 200px;"/>
        <button type="submit" class="btn-add">+</button>
      </form>
    `;
    if(data.agenda.length === 0){
      html += `<div class="empty"><div class="note-dot"></div><br>Nenhum dia de ensaio marcado ainda.</div>`;
      return html;
    }
    const ordenada = [...data.agenda].sort((a,b) => a.data.localeCompare(b.data) || (a.hora || "").localeCompare(b.hora || ""));
    html += ordenada.map((a, i) => {
      const editing = editingAgendaId === a.id;
      const passado = a.data < hojeIso;
      const [y, m, d] = a.data.split("-");
      const weekday = AGENDA_DIAS_SEMANA[new Date(a.data + "T00:00:00").getDay()];
      const cor = passado ? "var(--muted)" : AGENDA_CORES[i % AGENDA_CORES.length];
      const tags = (a.tags || "").split(",").map(t => t.trim()).filter(Boolean);
      return `
      <div class="agenda-card" style="--agenda-accent:${cor};${passado ? "opacity:0.55;" : ""}">
        <div class="agenda-daynum">${d}<span class="agenda-month">${AGENDA_MESES[parseInt(m, 10) - 1]}</span></div>
        <div class="agenda-body">
          <div class="agenda-toprow">
            <div class="agenda-weekday">${weekday}</div>
            <div class="agenda-badge">${agendaRelativo(a.data, hojeIso)}</div>
            <button class="del-x" style="color:#25D366;" data-action="compartilhar-agenda" data-id="${a.id}" title="Compartilhar no WhatsApp"><span class="ico" style="margin:0;">${ICONS.whatsapp}</span></button>
            <button class="del-x" data-action="del-agenda" data-id="${a.id}">✕</button>
          </div>
          ${editing ? `
            <input type="text" class="edit-nome-input" id="input-edit-agenda-titulo" data-id="${a.id}" value="${escapeHtml(a.titulo || "")}" placeholder="Título" style="margin-bottom:8px;"/>
            <input type="text" class="edit-nome-input" id="input-edit-agenda-tags" data-id="${a.id}" value="${escapeHtml(a.tags || "")}" placeholder="Tags separadas por vírgula" style="margin-bottom:8px;"/>
            <button class="btn-save-nome" style="width:auto;padding:0 14px;" data-action="save-agenda-obs" data-id="${a.id}">Salvar</button>
            <div class="section-title" style="margin-top:12px;"><span class="ico">${ICONS.musicas}</span>Músicas do dia</div>
            ${[...data.musicas].filter(m => m.visivel !== false).sort((x,y) => x.nome.localeCompare(y.nome, "pt-BR", { sensitivity: "base" })).map(m => `
              <label class="check-row">
                <input type="checkbox" data-action="toggle-agenda-musica" data-agenda-id="${a.id}" data-musica-id="${m.id}" ${(a.musicaIds || []).includes(m.id) ? "checked" : ""} />
                <span>${escapeHtml(splitMusica(m.nome).titulo)}</span>
              </label>
            `).join("")}
          ` : `
            <div class="agenda-mainrow" data-action="edit-agenda-obs" data-id="${a.id}" style="cursor:pointer;">
              ${a.hora ? `<div class="agenda-time">${a.hora}</div>` : ""}
              <div class="agenda-title">${a.titulo ? escapeHtml(a.titulo) : "<span style=\"color:var(--muted);text-decoration:underline;\">Adicionar título</span>"}</div>
            </div>
            ${tags.length > 0 ? `<div class="agenda-tags">${tags.map(t => `<span class="agenda-tag">${escapeHtml(t)}</span>`).join("")}</div>` : ""}
            ${(a.musicaIds || []).length > 0 ? `<div class="agenda-tags" style="margin-top:4px;">${(a.musicaIds || []).map(id => data.musicas.find(m => m.id === id)).filter(Boolean).map(m => `<span class="agenda-tag"><span class="ico">${ICONS.musicas}</span>${escapeHtml(splitMusica(m.nome).titulo)}</span>`).join("")}</div>` : ""}
          `}
        </div>
      </div>`;
    }).join("");
    return html;
  }
