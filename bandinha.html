<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bandinha</title>
<link rel="manifest" href="manifest-editor.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17130F;
    --surface: #241D17;
    --surface-2: #2E251D;
    --gold: #F0A93C;
    --cream: #F4EEE1;
    --muted: #B8A99A;
    --rose: #D6402A;
    --green: #7FA85E;
    --blue: #C9932E;
    --line: rgba(244,238,225,0.12);
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;touch-action:manipulation;}
  body{
    background: var(--bg);
    color: var(--cream);
    font-family:'Montserrat',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:88px;
  }
  header.top{
    position:relative;
    overflow:hidden;
    aspect-ratio:1920/819;
    background-image:url('header.png');
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:flex-end;
  }
  header.top::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(23,19,15,0.92) 0%, rgba(23,19,15,0.35) 45%, transparent 75%);
    pointer-events:none;
  }
  .brand{
    position:relative;
    z-index:1;
    padding:14px 20px 14px 20px;
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:calc(28px * var(--font-scale, 1));
    letter-spacing:0.2px;
    display:flex;
    align-items:baseline;
    gap:10px;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  .brand small{
    font-family:'Montserrat',sans-serif;
    font-weight:500;
    font-size:calc(12px * var(--font-scale, 1));
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold);
  }
  .btn-logout{
    position:absolute;
    top:14px; right:14px;
    z-index:2;
    background:rgba(23,19,15,0.6);
    color:var(--cream);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 12px;
    font-size:calc(11px * var(--font-scale, 1));
    font-weight:600;
  }
  #auth-gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .login-box{
    width:100%;
    max-width:340px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px 24px;
  }
  .login-box form{display:flex;flex-direction:column;}

  main{
    flex:1;
    padding:6px 18px 20px 18px;
  }
  .section-title{
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    font-size:calc(20px * var(--font-scale, 1));
    margin:18px 2px 12px 2px;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    user-select:none;
  }
  .section-title .chevron{margin-left:auto;}
  .note-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--gold);
    display:inline-block;
    flex-shrink:0;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }
  .card-nova{
    background:rgba(255,122,26,0.08);
    border-color:#ff7a1a;
  }
  .empty{
    text-align:center;
    padding:36px 16px;
    color:var(--muted);
    font-size:calc(14px * var(--font-scale, 1));
    border:1px dashed var(--line);
    border-radius:var(--radius);
  }

  .agenda-card{
    display:flex;
    background:var(--surface);
    border:1px solid var(--line);
    border-left:4px solid var(--agenda-accent, var(--gold));
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
  }
  .agenda-daynum{
    flex:0 0 auto;
    width:78px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:calc(38px * var(--font-scale, 1));
    color:var(--agenda-accent, var(--gold));
    line-height:1;
    padding:14px 6px;
  }
  .agenda-month{
    font-weight:700;
    font-size:calc(12px * var(--font-scale, 1));
    letter-spacing:1px;
    margin-top:4px;
  }
  .agenda-body{
    flex:1 1 auto;
    min-width:0;
    padding:14px 14px 14px 0;
  }
  .agenda-toprow{
    display:flex;
    align-items:center;
    gap:10px;
    padding-bottom:10px;
    margin-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .agenda-weekday{
    font-weight:700;
    font-size:calc(15px * var(--font-scale, 1));
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--agenda-accent, var(--gold));
  }
  .agenda-badge{
    margin-left:auto;
    border:1px solid var(--line);
    border-radius:20px;
    padding:4px 12px;
    font-size:calc(12px * var(--font-scale, 1));
    color:var(--muted);
    white-space:nowrap;
  }
  .agenda-mainrow{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .agenda-time{
    color:var(--muted);
    font-weight:600;
    font-size:calc(14px * var(--font-scale, 1));
    flex:0 0 auto;
  }
  .agenda-title{
    font-weight:700;
    font-size:calc(16px * var(--font-scale, 1));
    flex:1 1 auto;
    min-width:120px;
  }
  .agenda-tags{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
  }
  .agenda-tag{
    background:rgba(240,169,60,0.15);
    color:var(--gold);
    border-radius:20px;
    padding:4px 12px;
    font-size:calc(12px * var(--font-scale, 1));
    font-weight:700;
  }
  .empty .note-dot{margin-bottom:8px;}

  form.inline-add{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  input[type=text], input[type=date], select{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--cream);
    border-radius:10px;
    padding:11px 12px;
    font-size:calc(15px * var(--font-scale, 1));
    font-family:'Montserrat',sans-serif;
    outline:none;
    width:100%;
  }
  input::placeholder{color:var(--muted);}
  input[type=text]:focus, input[type=date]:focus, select:focus{border-color:var(--gold);}

  button{
    font-family:'Montserrat',sans-serif;
    cursor:pointer;
    border:none;
  }
  .btn-add{
    background:var(--gold);
    color:var(--bg);
    font-weight:700;
    width:46px;
    border-radius:10px;
    font-size:calc(20px * var(--font-scale, 1));
    flex-shrink:0;
  }
  .btn-add:active{transform:scale(0.95);}

  .member-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .member-name{
    font-weight:600;
    font-size:calc(15.5px * var(--font-scale, 1));
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    cursor:pointer;
    border-bottom:1px dashed transparent;
  }
  .member-name:hover{border-bottom:1px dashed var(--muted);}
  .confirm-dot{
    width:11px;height:11px;border-radius:50%;
    flex-shrink:0;
    border:2px solid var(--muted);
    background:transparent;
    padding:0;
    cursor:pointer;
  }
  .confirm-dot.confirmed{
    background:var(--green);
    border-color:var(--green);
  }
  .edit-nome-input{
    flex:1;
    min-width:0;
    font-weight:600;
    font-size:calc(15.5px * var(--font-scale, 1));
    padding:6px 8px;
  }
  .btn-save-nome{
    flex-shrink:0;
    background:var(--gold);
    color:var(--bg);
    font-weight:700;
    width:32px;
    height:32px;
    border-radius:8px;
    font-size:calc(15px * var(--font-scale, 1));
  }
  .shirt-select{width:74px;flex-shrink:0;padding:8px 6px;font-size:calc(13px * var(--font-scale, 1));}
  .pay-toggle{
    flex-shrink:0;
    border-radius:10px;
    padding:9px 12px;
    font-size:calc(12.5px * var(--font-scale, 1));
    font-weight:600;
    background:var(--surface-2);
    color:var(--rose);
    border:1px solid rgba(214,64,42,0.4);
    white-space:nowrap;
  }
  .pay-toggle.paid{
    background:rgba(127,168,94,0.15);
    color:var(--green);
    border:1px solid rgba(127,168,94,0.4);
  }
  .stepper-label{display:block;color:var(--muted);font-size:calc(12px * var(--font-scale, 1));margin-bottom:6px;}
  .stepper-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .stepper-btn{
    flex-shrink:0;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--cream);
    border-radius:10px;
    padding:10px 14px;
    font-weight:700;
    font-size:calc(13px * var(--font-scale, 1));
  }
  .stepper-value{
    flex:1;
    text-align:center;
    font-weight:800;
    font-size:calc(20px * var(--font-scale, 1));
    color:var(--gold);
  }
  .btn-urgente{
    width:100%;
    margin-top:10px;
    background:rgba(214,64,42,0.15);
    color:var(--rose);
    border:1px solid rgba(214,64,42,0.5);
    border-radius:12px;
    padding:12px;
    font-weight:700;
    font-size:calc(14px * var(--font-scale, 1));
  }
  .ring-timer{
    position:relative;
    width:min(180px, 55vw);
    height:min(180px, 55vw);
    margin:8px auto;
  }
  .ring-timer svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-bg{fill:none;stroke:rgba(244,238,225,0.1);stroke-width:8;}
  .ring-progress{
    fill:none;
    stroke:var(--rose);
    stroke-width:8;
    stroke-linecap:round;
    transition:stroke-dashoffset 1s linear;
  }
  .ring-center{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ring-time{
    font-family:'Montserrat',sans-serif;
    font-weight:800;
    font-size:calc(30px * var(--font-scale, 1));
    color:var(--cream);
  }
  .aovivo-timer{font-family:'Montserrat',sans-serif;font-weight:800;font-size:calc(30px * var(--font-scale, 1));}
  .aovivo-timer.esgotado{color:var(--rose);}
  .del-x{
    flex-shrink:0;
    background:transparent;
    color:var(--muted);
    font-size:calc(16px * var(--font-scale, 1));
    width:22px;
    line-height:1;
  }
  .edit-x{
    flex-shrink:0;
    background:transparent;
    color:var(--muted);
    font-size:calc(15px * var(--font-scale, 1));
    width:22px;
    line-height:1;
  }
  .eye-x{
    flex-shrink:0;
    background:transparent;
    color:var(--muted);
    font-size:calc(15px * var(--font-scale, 1));
    width:22px;
    line-height:1;
  }
  .eye-x.hidden-item{color:var(--rose);}
  .reorder-btn{
    flex-shrink:0;
    background:transparent;
    color:var(--muted);
    font-size:calc(10px * var(--font-scale, 1));
    width:18px;
    line-height:1.2;
    padding:2px 0;
  }
  .reorder-btn:disabled{opacity:0.25;cursor:default;}
  .reorder-btn:not(:disabled):hover{color:var(--gold);}
  .card.item-hidden{opacity:0.5;}
  .member-sub{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--line);
    font-size:calc(12px * var(--font-scale, 1));
    color:var(--muted);
  }

  .gender-select{
    width:88px;
    flex:0 0 auto;
    padding:11px 8px;
    font-size:calc(13px * var(--font-scale, 1));
  }
  .import-gender-select{
    width:100%;
    margin-bottom:10px;
  }
  .link-btn{
    background:transparent;
    color:var(--gold);
    font-size:calc(13px * var(--font-scale, 1));
    font-weight:600;
    padding:4px 2px 14px 2px;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .import-box{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:16px;
  }
  .import-box textarea{
    width:100%;
    min-height:110px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--cream);
    border-radius:10px;
    padding:11px 12px;
    font-size:calc(14px * var(--font-scale, 1));
    font-family:'Montserrat',sans-serif;
    outline:none;
    resize:vertical;
    margin-bottom:10px;
  }
  .import-box textarea:focus{border-color:var(--gold);}
  .btn-import{
    background:var(--gold);
    color:var(--bg);
    font-weight:700;
    width:100%;
    border-radius:10px;
    padding:11px;
    font-size:calc(14px * var(--font-scale, 1));
  }
  .btn-import:active{transform:scale(0.98);}

  .check-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:calc(13.5px * var(--font-scale, 1));
    color:var(--muted);
    margin-bottom:14px;
    cursor:pointer;
  }
  .check-row input, .check-row-inline input{
    accent-color:var(--gold);
    width:15px;
    height:15px;
  }
  .check-row-inline{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:calc(11.5px * var(--font-scale, 1));
    color:var(--muted);
    cursor:pointer;
    white-space:nowrap;
  }
  .inst-tag{
    font-size:calc(10.5px * var(--font-scale, 1));
    font-weight:700;
    color:var(--gold);
    background:rgba(240,169,60,0.12);
    padding:2px 7px;
    border-radius:8px;
    white-space:nowrap;
  }
  .gender-fix-select{
    background:transparent;
    border:none;
    color:var(--gold);
    font-size:calc(12px * var(--font-scale, 1));
    font-weight:600;
    padding:0;
  }
  .stat-row{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  .stat{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
  }
  .stat .num{font-family:'Montserrat',sans-serif;font-size:calc(22px * var(--font-scale, 1));font-weight:700;}
  .stat .lbl{font-size:calc(11px * var(--font-scale, 1));color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}

  .song-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .song-name{flex:1;min-width:0;cursor:pointer;}
  .song-title{font-weight:600;font-size:calc(15px * var(--font-scale, 1));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .badge-nova{
    display:inline-block;
    background:linear-gradient(135deg, #ffb020, #ff7a1a);
    color:#241200;
    font-size:calc(9.5px * var(--font-scale, 1));
    font-weight:800;
    letter-spacing:0.5px;
    border-radius:6px;
    padding:2px 6px;
    vertical-align:middle;
    margin-right:2px;
  }
  .song-num{flex-shrink:0;color:var(--muted);font-weight:600;font-size:calc(13px * var(--font-scale, 1));width:20px;text-align:right;}
  .song-artist{font-weight:400;font-size:calc(12px * var(--font-scale, 1));color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
  .status-pill{
    flex-shrink:0;
    border:1px solid transparent;
    border-radius:20px;
    padding:7px 13px;
    font-size:calc(12px * var(--font-scale, 1));
    font-weight:600;
    white-space:nowrap;
  }
  .card-nova .status-pill{
    border-color:rgba(255,122,26,0.55);
  }
  .status-aprender{background:rgba(214,64,42,0.15);color:var(--rose);}
  .status-ensaiando{background:rgba(240,169,60,0.15);color:var(--gold);}
  .status-pronta{background:rgba(127,168,94,0.15);color:var(--green);}
  .lyrics-box{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .lyrics-text{
    white-space:pre-wrap;
    font-size:calc(14px * var(--font-scale, 1));
    line-height:1.6;
    color:var(--cream);
  }
  .lyrics-textarea{
    width:100%;
    min-height:160px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--cream);
    border-radius:10px;
    padding:11px 12px;
    font-size:calc(14px * var(--font-scale, 1));
    font-family:'Montserrat',sans-serif;
    outline:none;
    resize:vertical;
    margin-bottom:10px;
  }
  .lyrics-textarea:focus{border-color:var(--gold);}
  .video-frame{
    position:relative;
    width:100%;
    max-width:320px;
    margin:0 auto;
    padding-top:177.78%;
    border-radius:10px;
    overflow:hidden;
    background:#000;
  }
  .video-frame iframe{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    border:none;
  }
  .audio-frame{
    width:100%;
    height:80px;
    border-radius:10px;
    overflow:hidden;
    background:var(--surface-2);
    margin-bottom:12px;
  }
  .audio-frame iframe{
    width:100%;
    height:100%;
    border:none;
  }

  .roteiro-card{padding:0;overflow:hidden;}
  .roteiro-head{
    padding:15px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
  }
  .roteiro-title{font-family:'Montserrat',sans-serif;font-weight:600;font-size:calc(17px * var(--font-scale, 1));}
  .roteiro-date{font-size:calc(12px * var(--font-scale, 1));color:var(--gold);margin-top:2px;}
  .roteiro-countdown{font-size:calc(12px * var(--font-scale, 1));color:var(--gold);font-weight:700;margin-top:4px;}
  .roteiro-info-row{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
    color:var(--muted);
    font-size:calc(13px * var(--font-scale, 1));
    cursor:pointer;
    margin-bottom:12px;
    padding-bottom:12px;
    border-bottom:1px solid var(--line);
  }
  .roteiro-body{
    padding:0 16px 16px 16px;
    border-top:1px solid var(--line);
  }
  .item-row{
    display:flex;
    gap:10px;
    align-items:center;
    padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .item-row:last-of-type{border-bottom:none;}
  .item-time{
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    color:var(--gold);
    font-size:calc(14px * var(--font-scale, 1));
    width:52px;
    flex-shrink:0;
  }
  .item-activity{flex:1;font-size:calc(14px * var(--font-scale, 1));}
  .add-item-form{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .add-item-form input[type=text]:first-child{width:64px;flex:none;padding:11px 8px;text-align:center;}
  .chevron{color:var(--muted);transition:transform 0.2s;font-size:calc(14px * var(--font-scale, 1));}
  .chevron.open{transform:rotate(90deg);}

  nav.tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    max-width:560px;
    margin:0 auto;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom)) 6px;
    z-index:10;
  }
  nav.tabbar button{
    flex:1;
    background:transparent;
    color:var(--muted);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:8px 4px;
    border-radius:12px;
    font-size:calc(11px * var(--font-scale, 1));
    font-weight:600;
  }
  nav.tabbar button.active{color:var(--gold);background:rgba(240,169,60,0.1);}
  nav.tabbar button svg{width:20px;height:20px;}

  .hidden{display:none !important;}
  .font-ctrl{
    position:fixed;
    right:14px;
    bottom:96px;
    z-index:15;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--cream);

<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getMessaging, getToken, isSupported } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

const firebaseConfig = {
  apiKey: "AIzaSyDU22nU2MOfb-3Z9xBHYVxrXtFDaG5_93g",
  authDomain: "bandinha-a22ce.firebaseapp.com",
  projectId: "bandinha-a22ce",
  storageBucket: "bandinha-a22ce.firebasestorage.app",
  messagingSenderId: "808882413270",
  appId: "1:808882413270:web:91dbb55bc2256847ae3377"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);
const googleProvider = new GoogleAuthProvider();
const EMAILS_PERMITIDOS = ["krysnamurty@gmail.com"];
const integrantesCol = collection(db, "integrantes");
const musicasCol = collection(db, "musicas");
const roteirosCol = collection(db, "roteiros");
const coreografiasCol = collection(db, "coreografias");
const configDocRef = doc(db, "config", "main");
const progressoCol = collection(db, "progresso");
const visualizacoesCol = collection(db, "visualizacoes");
const agendaCol = collection(db, "agenda");
const historicoCol = collection(db, "historicoEnsaios");
const pushTokensCol = collection(db, "pushTokens");
const locaisCol = collection(db, "locais");
const aoVivoDocRef = doc(db, "aoVivo", "atual");
const avisosHistoricoCol = collection(db, "avisosHistorico");
const VAPID_KEY = "BAcCBOhrGoqnmA4cLwyRSFsSvSIafZGDB-tFHdTTC5gxCzAYLQjIb-AH5rFfqrHVo-g5I_r_RqQSC9Y9s2HWRvM";
const functionsApp = getFunctions(firebaseApp);

(function(){
  const SHIRT_SIZES = ["PP","P","M","G","GG","XG"];

  let data = { integrantes: [], musicas: [], roteiros: [], coreografias: [], progresso: [], agenda: [], locais: [], aoVivo: null, historico: [], visualizacoes: [], avisosHistorico: [], config: { titulo: "Bandinha", subtitulo: "2ª Igreja Congregacional" } };
  let loadedFlags = { integrantes: false, musicas: false, roteiros: false, coreografias: false, progresso: false, agenda: false, locais: false, aoVivo: false, historico: false, visualizacoes: false, config: false };
  let currentUser = null;
  let authReady = false;
  let currentTab = "integrantes";
  let openRoteiroId = null;
  let loaded = false;
  let importOpen = false;
  let collapsedGroups = {};
  let editingNameId = null;
  let expandedMemberId = null;
  let openMusicaId = null;
  let editingLetraId = null;
  let editingMusicaNomeId = null;
  let ensaioAtivo = false;
  let ensaioIndex = 0;
  let ensaioEditando = false;
  let ensaioSessaoIds = new Set();
  let historicoAtivo = false;
  let mostrarOcultasMusicas = true;
  let openCoreografiaId = null;
  let editingCoreografiaId = null;
  let editingProgressoNome = null;
  let editingAgendaId = null;
  let editingRoteiroInfoId = null;
  let selectedProximaEtapa = null;
  let enviandoAviso = false;
  let enviandoUrgente = false;
  let enviandoCustom = false;
  let avisoMinutosValor = 5;
  let avisoAntesMin = 5;
  let gerenciarLocais = false;
  let collapsedProgressoGroups = {};
  let editingBrand = false;
  let presencaAbertaData = null;

  const CATEGORIA_CORES = { "Femininas": "var(--rose)", "Masculinas": "var(--blue)", "Mista": "var(--gold)" };
  function corCategoria(cat){ return CATEGORIA_CORES[cat] || "var(--muted)"; }
  function extrairDriveId(url){
    const m = String(url).match(/\/d\/([a-zA-Z0-9_-]{10,})/) || String(url).match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
    return m ? m[1] : null;
  }
  function slugify(s){
    return String(s).trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function computeOrdemAlfabetica(nome){
    const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    const n = norm(nome);
    const lista = [...data.musicas].sort((a,b) => (a.ordem ?? 0) - (b.ordem ?? 0));
    let insertIdx = lista.findIndex(m => norm(m.nome) > n);
    if(insertIdx === -1) insertIdx = lista.length;
    const prev = lista[insertIdx - 1];
    const next = lista[insertIdx];
    const prevOrdem = prev ? (prev.ordem ?? 0) : (next ? (next.ordem ?? 1) - 1 : 0);
    const nextOrdem = next ? (next.ordem ?? prevOrdem + 1) : prevOrdem + 1;
    return (prevOrdem + nextOrdem) / 2;
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function formatLyrics(s){
    return escapeHtml(s)
      .replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(?<!\*)\*(?!\*)([\s\S]+?)(?<!\*)\*(?!\*)/g, "<em>$1</em>");
  }
  function splitMusica(nome){
    const m = String(nome).match(/^(.*?)\s*[-–—]\s*(.+)$/);
    return m ? { titulo: m[1].trim(), artista: m[2].trim() } : { titulo: String(nome).trim(), artista: "" };
  }
  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._h);
    showToast._h = setTimeout(()=> t.classList.remove("show"), 1600);
  }

  const FONT_SCALES = [0.9, 1, 1.15];
  const FONT_LABELS = ["Pequena", "Média", "Grande"];
  function initFontScale(){
    let saved = parseFloat(localStorage.getItem("bandinha-font-scale"));
    let idx = FONT_SCALES.indexOf(saved);
    if(idx === -1) idx = 1;
    applyFontScale(idx);
    document.getElementById("btn-font-size").addEventListener("click", () => {
      idx = (idx + 1) % FONT_SCALES.length;
      applyFontScale(idx);
      showToast(`Fonte: ${FONT_LABELS[idx]}`);
    });
  }
  function applyFontScale(idx){
    document.documentElement.style.setProperty("--font-scale", FONT_SCALES[idx]);
    localStorage.setItem("bandinha-font-scale", FONT_SCALES[idx]);
  }

  let pushSupported = false;
  function initPush(){
    const btn = document.getElementById("btn-push");
    btn.addEventListener("click", () => ativarPush(btn));
    isSupported().then(supported => {
      pushSupported = supported;
      renderAuthGate();
    });
  }

  async function ativarPush(btn){
    try{
      const permissao = await Notification.requestPermission();
      if(permissao !== "granted"){ showToast("Permissão de notificação negada"); return; }
      const registration = await navigator.serviceWorker.register("firebase-messaging-sw.js");
      const messaging = getMessaging(firebaseApp);
      const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
      if(!token){ showToast("Não foi possível gerar o token de notificação"); return; }
      await setDoc(doc(pushTokensCol, token), { token, criadoEm: Date.now(), plataforma: "coordenador" });
      showToast("Notificações ativadas!");
    }catch(err){
      console.error(err);
      showToast("Erro ao ativar notificações");
    }
  }

  function markLoaded(key){
    loadedFlags[key] = true;
    if(Object.values(loadedFlags).every(Boolean)){ loaded = true; }
  }

  function safeRender(){
    if(openCoreografiaId || ensaioAtivo || historicoAtivo){ return; }
    render();
  }

  function load(){
    onSnapshot(integrantesCol, snap => {
      data.integrantes = snap.docs.map(d => d.data());
      markLoaded("integrantes");
      safeRender();
    }, e => { console.error("Erro ao sincronizar integrantes:", e); showToast("Erro ao sincronizar"); });

    onSnapshot(musicasCol, snap => {
      data.musicas = snap.docs.map(d => d.data());
      markLoaded("musicas");
      safeRender();
    }, e => { console.error("Erro ao sincronizar músicas:", e); showToast("Erro ao sincronizar"); });

    onSnapshot(roteirosCol, snap => {
      data.roteiros = snap.docs.map(d => d.data());
      markLoaded("roteiros");
      safeRender();
    }, e => { console.error("Erro ao sincronizar roteiros:", e); showToast("Erro ao sincronizar"); });

    onSnapshot(coreografiasCol, snap => {
      data.coreografias = snap.docs.map(d => d.data());
      markLoaded("coreografias");
      safeRender();
    }, e => { console.error("Erro ao sincronizar coreografias:", e); showToast("Erro ao sincronizar"); });

    onSnapshot(configDocRef, snap => {
      data.config = snap.data() || { titulo: "Bandinha", subtitulo: "2ª Igreja Congregacional" };
      markLoaded("config");
      safeRender();
    }, e => { console.error("Erro ao sincronizar config:", e); showToast("Erro ao sincronizar"); });

    onSnapshot(progressoCol, snap => {
      data.progresso = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
      markLoaded("progresso");
      safeRender();
    }, e => { console.error("Erro ao sincronizar progresso:", e); showToast("Erro ao sincronizar"); });

    onSnapshot(visualizacoesCol, snap => {
      data.visualizacoes = snap.docs.map(d => d.data());
      markLoaded("visualizacoes");
      safeRender();
    }, e => { console.error("Erro ao sincronizar visualizações:", e); showToast("Erro ao sincronizar"); });

    onSnapshot(agendaCol, snap => {
      data.agenda = snap.docs.map(d => d.data());
      markLoaded("agenda");
      safeRender();
    }, e => { console.error("Erro ao sincronizar agenda:", e); showToast("Erro ao sincronizar"); });

    onSnapshot(historicoCol, snap => {
      data.historico = snap.docs.map(d => d.data());
      markLoaded("historico");
      safeRender();
    }, e => { console.error("Erro ao sincronizar histórico:", e); showToast("Erro ao sincronizar"); });

    onSnapshot(locaisCol, snap => {
      data.locais = snap.docs.map(d => d.data());
      markLoaded("locais");
      safeRender();
    }, e => {
      console.error("Erro ao sincronizar locais:", e);
      markLoaded("locais");
      safeRender();
    });

    onSnapshot(aoVivoDocRef, snap => {
      data.aoVivo = snap.exists() ? snap.data() : null;
      markLoaded("aoVivo");
      safeRender();
    }, e => {
      console.error("Erro ao sincronizar ao vivo:", e);
      markLoaded("aoVivo");
      safeRender();
    });

    onSnapshot(query(avisosHistoricoCol, orderBy("disparadoEm", "desc"), limit(10)), snap => {
      data.avisosHistorico = snap.docs.map(d => d.data());
      safeRender();
    }, e => console.error("Erro ao sincronizar histórico de avisos:", e));
  }

  function loadAuth(){
    onAuthStateChanged(auth, user => {
      if(user && !EMAILS_PERMITIDOS.includes(user.email)){
        signOut(auth);
        authReady = true;
        currentUser = null;
        renderAuthGate();
        showToast("Este e-mail não tem acesso ao painel");
        return;
      }
      currentUser = user;
      authReady = true;
      renderAuthGate();
      if(user){ load(); }
    });
  }

  function renderAuthGate(){
    const gate = document.getElementById("auth-gate");
    const appEl = document.getElementById("app");
    const navEl = document.querySelector("nav.tabbar");
    const fontBtn = document.getElementById("btn-font-size");
    const pushBtn = document.getElementById("btn-push");
    if(!authReady){
      gate.innerHTML = '<div class="empty">Carregando…</div>';
      gate.classList.remove("hidden");
      appEl.classList.add("hidden");
      navEl.classList.add("hidden");
      fontBtn.classList.add("hidden");
      pushBtn.classList.add("hidden");
      return;
    }
    if(currentUser){
      gate.classList.add("hidden");
      appEl.classList.remove("hidden");
      navEl.classList.remove("hidden");
      fontBtn.classList.remove("hidden");
      pushBtn.classList.toggle("hidden", !pushSupported);
      return;
    }
    appEl.classList.add("hidden");
    navEl.classList.add("hidden");
    fontBtn.classList.add("hidden");
    pushBtn.classList.add("hidden");
    gate.classList.remove("hidden");
    const ua = navigator.userAgent || "";
    const emAppEmbutido = /FBAN|FBAV|Instagram|WhatsApp|Line\//i.test(ua);
    gate.innerHTML = `
      <div class="login-box" style="text-align:center;">
        <div class="brand" style="padding:0 0 18px 0;justify-content:center;">Bandinha <small>2ª Igreja Congregacional</small></div>
        <p style="color:var(--muted);font-size:calc(11px * var(--font-scale, 1));margin:0 0 18px 0;">Área restrita ao coordenador</p>
        ${emAppEmbutido ? `
          <div style="background:rgba(214,64,42,0.15);border:1px solid rgba(214,64,42,0.4);border-radius:10px;padding:12px;margin-bottom:16px;color:var(--rose);font-size:calc(12.5px * var(--font-scale, 1));text-align:left;line-height:1.5;">
            O login com Google não funciona dentro do navegador do WhatsApp/Instagram.<br><br>
            <strong>Android:</strong> toque em ⋮ e escolha "Abrir no Chrome".<br>
            <strong>iPhone:</strong> toque em compartilhar (↑) e escolha "Abrir no Safari".
          </div>
        ` : ""}
        <button type="button" id="btn-google-login" class="btn-import">Entrar com Google</button>
        <div id="login-error" style="color:var(--rose);font-size:calc(13px * var(--font-scale, 1));margin-top:10px;"></div>
      </div>
    `;
    document.getElementById("btn-google-login").addEventListener("click", async () => {
      const errEl = document.getElementById("login-error");
      errEl.textContent = "";
      try{
        await signInWithPopup(auth, googleProvider);
      }catch(err){
        console.error(err);
        if(err.code === "auth/unauthorized-domain"){
          errEl.textContent = `Domínio "${location.hostname}" não autorizado no Firebase. Peça pro coordenador adicioná-lo em Authentication > Settings > Domínios autorizados.`;
        } else if(err.code === "auth/popup-blocked"){
          errEl.textContent = "O navegador bloqueou a janela de login. Permita pop-ups e tente de novo.";
        } else if(err.code === "auth/popup-closed-by-user" || err.code === "auth/cancelled-popup-request"){
          errEl.textContent = "";
        } else {
          errEl.textContent = `Não foi possível entrar (${err.code || "erro desconhecido"}). Tente novamente.`;
        }
      }
    });
  }

  // ---------- RENDER ----------
  function render(){
    const main = document.getElementById("main");
    renderBrand();
    if(!loaded){
      main.innerHTML = '<div class="empty">Carregando…</div>';
      return;
    }
    if(ensaioAtivo || historicoAtivo){
      document.getElementById("app").classList.add("hidden");
      document.querySelector("nav.tabbar").classList.add("hidden");
      document.getElementById("ensaio-overlay").classList.remove("hidden");
      document.getElementById("ensaio-overlay").innerHTML = historicoAtivo ? renderHistorico() : renderModoEnsaio();
      attachHandlers();
      return;
    }
    document.getElementById("ensaio-overlay").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.querySelector("nav.tabbar").classList.remove("hidden");

    const scrollY = window.scrollY;
    if(currentTab === "integrantes") main.innerHTML = renderIntegrantes();
    else if(currentTab === "musicas") main.innerHTML = renderMusicas();
    else if(currentTab === "roteiros") main.innerHTML = renderRoteiros();
    else if(currentTab === "coreografias") main.innerHTML = renderCoreografias();
    else if(currentTab === "progresso") main.innerHTML = renderProgresso();
    else if(currentTab === "agenda") main.innerHTML = renderAgenda();
    else main.innerHTML = renderAoVivo();

    attachHandlers();
    window.scrollTo(0, scrollY);
  }

  function renderBrand(){
    const brand = document.getElementById("brand");
    if(!brand) return;
    const cfg = data.config || { titulo: "Bandinha", subtitulo: "2ª Igreja Congregacional" };
    if(editingBrand){
      brand.onclick = null;
      brand.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:6px;">
          <input type="text" id="input-brand-titulo" value="${escapeHtml(cfg.titulo)}" placeholder="Título" style="font-size:calc(18px * var(--font-scale, 1));padding:8px 10px;" />
          <input type="text" id="input-brand-subtitulo" value="${escapeHtml(cfg.subtitulo)}" placeholder="Subtítulo" style="font-size:calc(13px * var(--font-scale, 1));padding:7px 10px;" />
          <button type="button" class="btn-save-nome" style="width:auto;padding:0 14px;height:34px;" data-action="save-brand">Salvar</button>
        </div>
      `;
      brand.classList.add("brand");
      const t = document.getElementById("input-brand-titulo");
      if(t) t.focus();
      const btn = brand.querySelector('[data-action="save-brand"]');

  function formatDate(iso){
    const [y,m,d] = iso.split("-");
    return `${d}/${m}/${y}`;
  }

  function roteiroCountdown(r){
    if(!r.data) return null;
    const alvo = new Date(`${r.data}T${r.hora || "00:00"}:00`).getTime();
    const diffMin = Math.round((alvo - Date.now()) / 60000);
    if(diffMin <= 0) return null;
    const dias = Math.floor(diffMin / 1440);
    const horas = Math.floor((diffMin % 1440) / 60);
    const minutos = diffMin % 60;
    if(dias > 0) return `Faltam ${dias}d ${horas}h`;
    if(horas > 0) return `Faltam ${horas}h ${minutos}min`;
    return `Faltam ${minutos}min`;
  }

  function diasDesde(dataIso){
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const d = new Date(dataIso + "T00:00:00");
    return Math.round((hoje - d) / 86400000);
  }

  function renderHistorico(){
    const musicas = [...data.musicas].sort((a,b) => {
      if(!a.ultimoEnsaio && !b.ultimoEnsaio) return a.nome.localeCompare(b.nome, "pt-BR", { sensitivity: "base" });
      if(!a.ultimoEnsaio) return -1;
      if(!b.ultimoEnsaio) return 1;
      return a.ultimoEnsaio.localeCompare(b.ultimoEnsaio);
    });
    const sessoes = [...data.historico].sort((a,b) => b.data.localeCompare(a.data));
    return `

        </div>

  const PROGRESSO_LABELS = { precisa_treinar: "Preciso treinar", aprendi: "Aprendi", ensaiei: "Ensaiei" };
  const PROGRESSO_CLASSES = { precisa_treinar: "status-aprender", aprendi: "status-ensaiando", ensaiei: "status-pronta" };

  function renderProgresso(){
    const nomes = [...new Set(data.progresso.map(p => p.nome))].sort((a,b) => a.localeCompare(b));
    let html = `
      <div class="stat-row">
        <div class="stat"><div class="num">${nomes.length}</div><div class="lbl">Pessoas</div></div>

      </div>
    `;
    if(nomes.length === 0){
      html += `<div class="empty"><div class="note-dot"></div><br>Ninguém marcou progresso pessoal ainda.</div>`;
      return html;
    }
    html += nomes.map(nome => {
      const entradas = data.progresso.filter(p => p.nome === nome && p.status);
      const key = "prog-" + nome;
      const collapsed = key in collapsedProgressoGroups ? !!collapsedProgressoGroups[key] : true;
      const editing = editingProgressoNome === nome;
      return `
      <div class="card" style="padding:0;overflow:hidden;">
        <div class="roteiro-head" data-action="toggle-progresso-group" data-nome="${escapeHtml(nome)}">
          <div style="display:flex;align-items:center;gap:10px;">
            ${editing ? `
              <input type="text" class="edit-nome-input" id="input-rename-progresso" value="${escapeHtml(nome)}" onclick="event.stopPropagation()" />
            ` : `<div class="roteiro-title">${escapeHtml(nome)} <span style="color:var(--muted);font-weight:400;font-size:calc(14px * var(--font-scale, 1));">(${entradas.length})</span></div>`}
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            ${editing ? `
              <button class="btn-save-nome" style="width:auto;padding:0 12px;" data-action="save-rename-progresso" data-nome="${escapeHtml(nome)}">Salvar</button>
            ` : `
              <button type="button" class="link-btn" style="padding:0;" data-action="rename-progresso" data-nome="${escapeHtml(nome)}">Renomear</button>
              <button class="del-x" data-action="del-progresso-nome" data-nome="${escapeHtml(nome)}">✕</button>
              <span class="chevron ${collapsed?"":"open"}">▶</span>
            `}
          </div>
        </div>
        <div class="roteiro-body ${collapsed?"hidden":""}">
          ${entradas.length === 0 ? '<div style="color:var(--muted);font-size:calc(13px * var(--font-scale, 1));padding:10px 0;">Sem marcações.</div>' : entradas.map(p => {
            const musica = data.musicas.find(m => m.id === p.musicaId);
            return `
            <div class="item-row">
              <div class="item-activity">${escapeHtml(musica ? musica.nome : "(música removida)")}</div>
              <span class="status-pill ${PROGRESSO_CLASSES[p.status] || ''}">${PROGRESSO_LABELS[p.status] || p.status}</span>
              <button class="del-x" data-action="del-progresso-entrada" data-docid="${p.docId}">✕</button>

  const AGENDA_DIAS_SEMANA = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
  const AGENDA_MESES = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
  const AGENDA_CORES = ["var(--gold)","var(--rose)"];

  function agendaRelativo(iso, hojeIso){
    const diffMs = new Date(iso + "T00:00:00") - new Date(hojeIso + "T00:00:00");
    const dias = Math.round(diffMs / 86400000);
    if(dias === 0) return "hoje";
    if(dias === 1) return "amanhã";
    if(dias > 1) return `em ${dias} dias`;
    if(dias === -1) return "ontem";
    return `há ${Math.abs(dias)} dias`;
  }

  function renderRingTimer(restanteSeg, totalSeg){
    const r = 54;
    const c = 2 * Math.PI * r;
    const fracao = totalSeg > 0 ? Math.min(1, restanteSeg / totalSeg) : 0;
    const offset = c * (1 - fracao);
    const mm = String(Math.floor(restanteSeg / 60)).padStart(2, "0");
    const ss = String(restanteSeg % 60).padStart(2, "0");
    return `
      <div class="ring-timer">
        <svg viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="${r}"></circle>
          <circle class="ring-progress" cx="60" cy="60" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
        </svg>
        <div class="ring-center">
          <div class="ring-time">${mm}:${ss}</div>
        </div>
      </div>
    `;
  }

  function renderAoVivoStatus(){
    const a = data.aoVivo;
    if(!a) return "";
    const restanteSeg = Math.max(0, Math.round((a.disparadoEm + a.minutos * 60000 - Date.now()) / 1000));
    const esgotado = restanteSeg <= 0;
    return `
      <div class="card" style="border-left:3px solid ${a.urgente ? "var(--rose)" : "var(--gold)"};margin-bottom:16px;text-align:center;">
        <div style="font-weight:700;margin-bottom:10px;">${a.urgente ? "🚨 URGENTE — corram para " + escapeHtml(a.proximaEtapa) : a.custom ? "📢 " + escapeHtml(a.proximaEtapa) : "📍 " + escapeHtml(a.proximaEtapa)}</div>
        ${a.urgente || a.custom ? "" : esgotado ? `<div class="aovivo-timer esgotado">Tempo esgotado</div>` : renderRingTimer(restanteSeg, a.minutos * 60)}
        <div style="display:flex;justify-content:center;gap:8px;margin-top:14px;">
          ${!a.urgente && a.minutos > 0 ? `<button type="button" id="btn-reiniciar-aovivo" class="link-btn" style="white-space:nowrap;">Reiniciar</button>` : ""}
          <button type="button" id="btn-parar-aovivo" class="del-x" style="width:auto;padding:4px 10px;border:1px solid var(--line);border-radius:20px;">Parar</button>
        </div>
      </div>
    `;
  }

    `).join("");

  const TIPO_ICONE = { urgente: "🚨", custom: "📢", normal: "📍" };
  function renderHistoricoAvisos(){
    if(data.avisosHistorico.length === 0) return "";
    return `

  function renderSetlistHoje(){
    const setlist = getSetlist();
    if(setlist.length === 0) return "";
    return `

        const { titulo } = splitMusica(m.nome);
        const entradas = data.progresso.filter(p => p.musicaId === m.id && p.status);

        entradas.forEach(p => { if(counts[p.status] !== undefined) counts[p.status]++; });
        return `
        <div class="card" style="padding:10px 14px;">
          <div style="font-weight:600;margin-bottom:8px;">${escapeHtml(titulo)}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <span class="status-pill status-aprender" style="padding:3px 9px;font-size:calc(11px * var(--font-scale, 1));">${counts.precisa_treinar} treinar</span>

      }).join("")}

  function renderAoVivo(){
    let html = renderAoVivoStatus() + `
      <div class="empty" style="text-align:left;padding:16px;margin-bottom:16px;border-style:solid;">

      html += `<button type="button" id="btn-toggle-gerenciar-locais" class="link-btn" style="margin-bottom:10px;">${gerenciarLocais ? "Concluir" : "Gerenciar badges"}</button>`;

        html += `</div>`;
      }

      html += `
        <div class="card" style="margin-top:4px;">
          <label class="stepper-label">Próxima etapa</label>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">${renderBadgeChips("select-proxima-etapa", selectedProximaEtapa)}</div>

          <div style="display:flex;gap:8px;">
            <button type="button" class="pay-toggle ${avisoAntesMin === 10 ? "paid" : ""}" data-action="select-aviso-antes" data-min="10">Avisar 10 min antes</button>

          </div>
          <button type="button" id="btn-disparar-aviso" class="btn-import" style="margin-top:14px;" ${(!selectedProximaEtapa || enviandoAviso) ? "disabled" : ""}>${enviandoAviso ? "Enviando..." : "Disparar aviso"}</button>

        </div>
      `;

    html += `
      <div class="card" style="margin-top:16px;">

        <textarea id="input-aviso-custom" placeholder="Escreva um texto livre para enviar a todos..." style="width:100%;min-height:70px;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:inherit;font-family:inherit;font-size:calc(14px * var(--font-scale, 1));resize:vertical;"></textarea>

      </div>
    `;
    html += renderSetlistHoje() + renderHistoricoAvisos();
    return html;
  }

  function renderAgenda(){
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const hojeIso = hoje.toISOString().slice(0,10);
    let html = `
      <form class="inline-add" id="form-agenda" style="flex-wrap:wrap;">
        <input type="date" id="input-agenda-data" required style="flex:0 0 150px;"/>

        <button type="submit" class="btn-add">+</button>
      </form>
    `;
    if(data.agenda.length === 0){
      html += `<div class="empty"><div class="note-dot"></div><br>Nenhum dia de ensaio marcado ainda.</div>`;
      return html;
    }
    const ordenada = [...data.agenda].sort((a,b) => a.data.localeCompare(b.data) || (a.hora || "").localeCompare(b.hora || ""));
    html += ordenada.map((a, i) => {
      const editing = editingAgendaId === a.id;
      const passado = a.data < hojeIso;
      const [y, m, d] = a.data.split("-");
      const weekday = AGENDA_DIAS_SEMANA[new Date(a.data + "T00:00:00").getDay()];
      const cor = passado ? "var(--muted)" : AGENDA_CORES[i % AGENDA_CORES.length];
      const tags = (a.tags || "").split(",").map(t => t.trim()).filter(Boolean);
      return `
      <div class="agenda-card" style="--agenda-accent:${cor};${passado ? "opacity:0.55;" : ""}">
        <div class="agenda-daynum">${d}<span class="agenda-month">${AGENDA_MESES[parseInt(m, 10) - 1]}</span></div>
        <div class="agenda-body">
          <div class="agenda-toprow">
            <div class="agenda-weekday">${weekday}</div>
            <div class="agenda-badge">${agendaRelativo(a.data, hojeIso)}</div>
            <button class="del-x" data-action="del-agenda" data-id="${a.id}">✕</button>
          </div>
          ${editing ? `
            <input type="text" class="edit-nome-input" id="input-edit-agenda-titulo" data-id="${a.id}" value="${escapeHtml(a.titulo || "")}" placeholder="Título" style="margin-bottom:8px;"/>
            <input type="text" class="edit-nome-input" id="input-edit-agenda-tags" data-id="${a.id}" value="${escapeHtml(a.tags || "")}" placeholder="Tags separadas por vírgula" style="margin-bottom:8px;"/>
            <button class="btn-save-nome" style="width:auto;padding:0 14px;" data-action="save-agenda-obs" data-id="${a.id}">Salvar</button>
          ` : `
            <div class="agenda-mainrow" data-action="edit-agenda-obs" data-id="${a.id}" style="cursor:pointer;">
              ${a.hora ? `<div class="agenda-time">${a.hora}</div>` : ""}
              <div class="agenda-title">${a.titulo ? escapeHtml(a.titulo) : "<span style=\"color:var(--muted);text-decoration:underline;\">Adicionar título</span>"}</div>
            </div>
            ${tags.length > 0 ? `<div class="agenda-tags">${tags.map(t => `<span class="agenda-tag">${escapeHtml(t)}</span>`).join("")}</div>` : ""}
          `}
        </div>
      </div>`;
    }).join("");
    return html;
  }

        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(!item) return;
        await updateDoc(doc(integrantesCol, item.id), { inscricao: !item.inscricao });
      });
    });

    document.querySelectorAll('[data-action="toggle-camisa-pag"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(!item) return;
        await updateDoc(doc(integrantesCol, item.id), { pagamentoCamisa: !item.pagamentoCamisa });
      });
    });

    document.querySelectorAll('[data-action="toggle-taxa"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(!item) return;
        await updateDoc(doc(integrantesCol, item.id), { taxaEquipe: !item.taxaEquipe });
      });
    });

    document.querySelectorAll('[data-action="toggle-confirmado"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(item){ await updateDoc(doc(integrantesCol, item.id), { confirmado: !item.confirmado }); }
      });
    });

    document.querySelectorAll('[data-action="toggle-instrumental"]').forEach(el => {
      el.addEventListener("change", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(item){ await updateDoc(doc(integrantesCol, item.id), { instrumental: el.checked }); }
      });
    });

    document.querySelectorAll('[data-action="fix-gender"]').forEach(el => {
      el.addEventListener("change", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(item){ await updateDoc(doc(integrantesCol, item.id), { genero: el.value }); }
      });
    });

    document.querySelectorAll('[data-action="toggle-group"]').forEach(el => {
      el.addEventListener("click", () => {
        const g = el.dataset.group;
        collapsedGroups[g] = !collapsedGroups[g];
        render();
      });
    });

    document.querySelectorAll('[data-action="toggle-progresso-group"]').forEach(el => {
      el.addEventListener("click", () => {
        if(editingProgressoNome) return;
        const key = "prog-" + el.dataset.nome;
        collapsedProgressoGroups[key] = !collapsedProgressoGroups[key];
        render();
      });
    });

    document.querySelectorAll('[data-action="rename-progresso"]').forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        editingProgressoNome = el.dataset.nome;
        render();
        const input = document.getElementById("input-rename-progresso");
        if(input){ input.focus(); input.select(); }
      });
    });

    document.querySelectorAll('[data-action="save-rename-progresso"]').forEach(el => {
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        const nomeAntigo = el.dataset.nome;
        const input = document.getElementById("input-rename-progresso");
        const novoNome = input ? input.value.trim() : "";
        if(novoNome && novoNome !== nomeAntigo){
          const entradas = data.progresso.filter(p => p.nome === nomeAntigo);
          await Promise.all(entradas.map(p => {
            const novoDocId = `${slugify(novoNome)}_${p.musicaId}`;
            const { docId, ...campos } = p;
            return setDoc(doc(progressoCol, novoDocId), { ...campos, nome: novoNome })
              .then(() => deleteDoc(doc(progressoCol, docId)));
          }));
          showToast("Nome atualizado");
        }
        editingProgressoNome = null;
        render();
      });
    });

    document.querySelectorAll('[data-action="del-progresso-nome"]').forEach(el => {
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        const nome = el.dataset.nome;
        if(!confirm(`Remover todo o progresso de "${nome}"?`)) return;
        const entradas = data.progresso.filter(p => p.nome === nome);
        await Promise.all(entradas.map(p => deleteDoc(doc(progressoCol, p.docId))));
        showToast("Progresso removido");
      });
    });

    document.querySelectorAll('[data-action="del-progresso-entrada"]').forEach(el => {
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        if(!confirm("Remover esta marcação?")) return;
        await deleteDoc(doc(progressoCol, el.dataset.docid));
      });
    });

    document.querySelectorAll('[data-action="del-integrante"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(!confirm(`Remover ${item ? item.nome : "este integrante"}?`)) return;
        await deleteDoc(doc(integrantesCol, el.dataset.id)); showToast("Integrante removido");
      });
    });

    document.querySelectorAll('[data-action="toggle-musica"]').forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        openMusicaId = (openMusicaId === id) ? null : id;
        editingLetraId = null;
        render();
      });
    });

    document.querySelectorAll('[data-action="edit-letra"]').forEach(el => {
      el.addEventListener("click", () => {
        editingLetraId = el.dataset.id;
        render();
      });
    });

    document.querySelectorAll('[data-action="save-letra"]').forEach(el => {
      el.addEventListener("click", async () => {
        const textarea = document.querySelector('.lyrics-textarea');
        const item = data.musicas.find(m => m.id === el.dataset.id);
        if(item && textarea){ await updateDoc(doc(musicasCol, item.id), { letra: textarea.value.trim() }); }
        editingLetraId = null;
        render();
      });
    });

    document.querySelectorAll('[data-action="edit-musica-nome"]').forEach(el => {
      el.addEventListener("click", () => {
        editingMusicaNomeId = el.dataset.id;
        render();
        const input = document.getElementById("input-edit-musica-nome");
        if(input){ input.focus(); input.select(); }
      });
    });

    async function salvarMusicaNome(id, input){
      const novoNome = input.value.trim();
      if(novoNome){ await updateDoc(doc(musicasCol, id), { nome: novoNome }); }
      editingMusicaNomeId = null;
      render();
    }

    document.querySelectorAll('[data-action="save-musica-nome"]').forEach(el => {
      el.addEventListener("click", () => {
        const input = document.getElementById("input-edit-musica-nome");
        if(input) salvarMusicaNome(el.dataset.id, input);
      });
    });

    const inputEditMusicaNome = document.getElementById("input-edit-musica-nome");
    if(inputEditMusicaNome){
      inputEditMusicaNome.addEventListener("keydown", e => {
        if(e.key === "Enter"){ e.preventDefault(); salvarMusicaNome(inputEditMusicaNome.dataset.id, inputEditMusicaNome); }
        else if(e.key === "Escape"){ editingMusicaNomeId = null; render(); }
      });
      inputEditMusicaNome.addEventListener("blur", () => {
        if(editingMusicaNomeId === inputEditMusicaNome.dataset.id) salvarMusicaNome(inputEditMusicaNome.dataset.id, inputEditMusicaNome);
      });
    }

    document.querySelectorAll('[data-action="cycle-status"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.musicas.find(m => m.id === el.dataset.id);
        if(!item) return;
        const order = ["ensaiando","pronta"];
        const novoStatus = order[(order.indexOf(item.status)+1) % order.length];
        await updateDoc(doc(musicasCol, item.id), { status: novoStatus });
      });
    });

    document.querySelectorAll('[data-action="toggle-setlist-musica"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.musicas.find(m => m.id === el.dataset.id);
        if(!item) return;
        const noSetlist = !item.noSetlist;
        await updateDoc(doc(musicasCol, item.id), { noSetlist });
        showToast(noSetlist ? "Adicionada ao setlist" : "Removida do setlist");
      });
    });

    document.querySelectorAll('[data-action="toggle-visivel-musica"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.musicas.find(m => m.id === el.dataset.id);
        if(!item) return;
        const oculta = item.visivel === false;
        await updateDoc(doc(musicasCol, item.id), { visivel: oculta });
        showToast(oculta ? "Música visível na página pública" : "Música ocultada da página pública");
      });
    });

    document.querySelectorAll('[data-action="del-musica"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.musicas.find(m => m.id === el.dataset.id);
        if(!confirm(`Remover ${item ? `"${item.nome}"` : "esta música"}?`)) return;
        await deleteDoc(doc(musicasCol, el.dataset.id)); showToast("Música removida");
      });
    });

    document.querySelectorAll('[data-action="toggle-roteiro"]').forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        openRoteiroId = (openRoteiroId === id) ? null : id;
        render();
      });
    });

    document.querySelectorAll('[data-action="del-roteiro"]').forEach(el => {
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        const r = data.roteiros.find(r => r.id === el.dataset.id);
        if(!confirm(`Remover o roteiro ${r ? `"${r.titulo}"` : ""}?`)) return;
        await deleteDoc(doc(roteirosCol, el.dataset.id)); showToast("Roteiro removido");
      });
    });

    document.querySelectorAll('[data-action="del-item"]').forEach(el => {
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        if(!confirm("Remover este horário do roteiro?")) return;
        const r = data.roteiros.find(r => r.id === el.dataset.roteiro);
        if(r){
          const novosItens = r.itens.filter(it => it.id !== el.dataset.item);
          await updateDoc(doc(roteirosCol, r.id), { itens: novosItens });
        }
      });
    });

    document.querySelectorAll('[data-action="form-add-item"]').forEach(form => {
      form.addEventListener("submit", async e => {
        e.preventDefault();
        e.stopPropagation();
        const r = data.roteiros.find(r => r.id === form.dataset.roteiro);
        if(!r) return;
        const horario = form.querySelector(".item-horario-input").value.trim();
        const atividade = form.querySelector(".item-atividade-input").value.trim();
        if(!horario || !atividade) return;
        openRoteiroId = r.id;
        const novosItens = [...r.itens, { id: uid(), horario, atividade }];
        await updateDoc(doc(roteirosCol, r.id), { itens: novosItens });
      });
    });
  }

  function irParaTab(tab){
    currentTab = tab;
    document.querySelectorAll("nav.tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
    render();
  }

  document.querySelectorAll("nav.tabbar button").forEach(btn => {
    btn.addEventListener("click", () => irParaTab(btn.dataset.tab));
  });

  if(navigator.serviceWorker) navigator.serviceWorker.addEventListener("message", e => {
    if(e.data?.type === "goto" && e.data.url){
      const tab = new URL(e.data.url, location.href).searchParams.get("tab");
      if(tab) irParaTab(tab);
    }
  });

  const tabDaUrl = new URLSearchParams(location.search).get("tab");
  if(tabDaUrl) currentTab = tabDaUrl;

  document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

  initFontScale();
  initPush();
  loadAuth();
  if(tabDaUrl) irParaTab(tabDaUrl);

  setInterval(() => {
    const focused = document.activeElement;
    const isTyping = focused && (focused.tagName === "INPUT" || focused.tagName === "TEXTAREA");
    if(currentTab === "roteiros" && loaded && !isTyping) render();
  }, 30000);

  setInterval(() => {
    const focused = document.activeElement;
    const isTyping = focused && (focused.tagName === "INPUT" || focused.tagName === "TEXTAREA");
    if(currentTab === "aovivo" && loaded && !isTyping) render();
  }, 1000);
})();
</script>
</body>
</html>
