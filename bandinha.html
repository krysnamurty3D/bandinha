<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bandinha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17130F;
    --surface: #241D17;
    --surface-2: #2E251D;
    --gold: #F0A93C;
    --cream: #F4EEE1;
    --muted: #B8A99A;
    --rose: #D6402A;
    --green: #7FA85E;
    --blue: #C9932E;
    --line: rgba(244,238,225,0.12);
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--cream);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:88px;
  }
  header.top{
    position:relative;
    overflow:hidden;
    aspect-ratio:1920/819;
    background-image:url('header.png');
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:flex-end;
  }
  header.top::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(23,19,15,0.92) 0%, rgba(23,19,15,0.35) 45%, transparent 75%);
    pointer-events:none;
  }
  .brand{
    position:relative;
    z-index:1;
    padding:14px 20px 14px 20px;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:32px;
    letter-spacing:0.2px;
    display:flex;
    align-items:baseline;
    gap:10px;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  .brand small{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:16px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold);
  }
  .btn-logout{
    position:absolute;
    top:14px; right:14px;
    z-index:2;
    background:rgba(23,19,15,0.6);
    color:var(--cream);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 12px;
    font-size:15px;
    font-weight:600;
  }
  #auth-gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .login-box{
    width:100%;
    max-width:340px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px 24px;
  }
  .login-box form{display:flex;flex-direction:column;}

  main{
    flex:1;
    padding:6px 18px 20px 18px;
  }
  .section-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:24px;
    margin:18px 2px 12px 2px;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    user-select:none;
  }
  .section-title .chevron{margin-left:auto;}
  .note-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--gold);
    display:inline-block;
    flex-shrink:0;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }
  .empty{
    text-align:center;
    padding:36px 16px;
    color:var(--muted);
    font-size:18px;
    border:1px dashed var(--line);
    border-radius:var(--radius);
  }
  .empty .note-dot{margin-bottom:8px;}

  form.inline-add{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  input[type=text], input[type=date], select{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--cream);
    border-radius:10px;
    padding:11px 12px;
    font-size:19px;
    font-family:'Inter',sans-serif;
    outline:none;
    width:100%;
  }
  input::placeholder{color:var(--muted);}
  input[type=text]:focus, input[type=date]:focus, select:focus{border-color:var(--gold);}

  button{
    font-family:'Inter',sans-serif;
    cursor:pointer;
    border:none;
  }
  .btn-add{
    background:var(--gold);
    color:var(--bg);
    font-weight:700;
    width:46px;
    border-radius:10px;
    font-size:24px;
    flex-shrink:0;
  }
  .btn-add:active{transform:scale(0.95);}

  .member-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .member-name{
    font-weight:600;
    font-size:19.5px;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    cursor:pointer;
    border-bottom:1px dashed transparent;
  }
  .member-name:hover{border-bottom:1px dashed var(--muted);}
  .edit-nome-input{
    flex:1;
    min-width:0;
    font-weight:600;
    font-size:19.5px;
    padding:6px 8px;
  }
  .btn-save-nome{
    flex-shrink:0;
    background:var(--gold);
    color:var(--bg);
    font-weight:700;
    width:32px;
    height:32px;
    border-radius:8px;
    font-size:19px;
  }
  .shirt-select{width:74px;flex-shrink:0;padding:8px 6px;font-size:17px;}
  .pay-toggle{
    flex-shrink:0;
    border-radius:10px;
    padding:9px 12px;
    font-size:16.5px;
    font-weight:600;
    background:var(--surface-2);
    color:var(--rose);
    border:1px solid rgba(214,64,42,0.4);
    white-space:nowrap;
  }
  .pay-toggle.paid{
    background:rgba(127,168,94,0.15);
    color:var(--green);
    border:1px solid rgba(127,168,94,0.4);
  }
  .del-x{
    flex-shrink:0;
    background:transparent;
    color:var(--muted);
    font-size:20px;
    width:22px;
    line-height:1;
  }
  .member-sub{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--line);
    font-size:16px;
    color:var(--muted);
  }

  .gender-select{
    width:88px;
    flex:0 0 auto;
    padding:11px 8px;
    font-size:17px;
  }
  .import-gender-select{
    width:100%;
    margin-bottom:10px;
  }
  .link-btn{
    background:transparent;
    color:var(--gold);
    font-size:17px;
    font-weight:600;
    padding:4px 2px 14px 2px;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .import-box{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:16px;
  }
  .import-box textarea{
    width:100%;
    min-height:110px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--cream);
    border-radius:10px;
    padding:11px 12px;
    font-size:18px;
    font-family:'Inter',sans-serif;
    outline:none;
    resize:vertical;
    margin-bottom:10px;
  }
  .import-box textarea:focus{border-color:var(--gold);}
  .btn-import{
    background:var(--gold);
    color:var(--bg);
    font-weight:700;
    width:100%;
    border-radius:10px;
    padding:11px;
    font-size:18px;
  }
  .btn-import:active{transform:scale(0.98);}

  .check-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:17.5px;
    color:var(--muted);
    margin-bottom:14px;
    cursor:pointer;
  }
  .check-row input, .check-row-inline input{
    accent-color:var(--gold);
    width:15px;
    height:15px;
  }
  .check-row-inline{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:15.5px;
    color:var(--muted);
    cursor:pointer;
    white-space:nowrap;
  }
  .inst-tag{
    font-size:14.5px;
    font-weight:700;
    color:var(--gold);
    background:rgba(240,169,60,0.12);
    padding:2px 7px;
    border-radius:8px;
    white-space:nowrap;
  }
  .gender-fix-select{
    background:transparent;
    border:none;
    color:var(--gold);
    font-size:16px;
    font-weight:600;
    padding:0;
  }
  .stat-row{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  .stat{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
  }
  .stat .num{font-family:'Fraunces',serif;font-size:26px;font-weight:700;}
  .stat .lbl{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}

  .song-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .song-name{flex:1;font-weight:600;font-size:19px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
  .status-pill{
    flex-shrink:0;
    border-radius:20px;
    padding:7px 13px;
    font-size:16px;
    font-weight:600;
    white-space:nowrap;
  }
  .status-aprender{background:rgba(214,64,42,0.15);color:var(--rose);}
  .status-ensaiando{background:rgba(240,169,60,0.15);color:var(--gold);}
  .status-pronta{background:rgba(127,168,94,0.15);color:var(--green);}
  .lyrics-box{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .lyrics-text{
    white-space:pre-wrap;
    font-size:18px;
    line-height:1.6;
    color:var(--cream);
  }
  .lyrics-textarea{
    width:100%;
    min-height:160px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--cream);
    border-radius:10px;
    padding:11px 12px;
    font-size:18px;
    font-family:'Inter',sans-serif;
    outline:none;
    resize:vertical;
    margin-bottom:10px;
  }
  .lyrics-textarea:focus{border-color:var(--gold);}
  .video-frame{
    position:relative;
    width:100%;
    max-width:320px;
    margin:0 auto;
    padding-top:177.78%;
    border-radius:10px;
    overflow:hidden;
    background:#000;
  }
  .video-frame iframe{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    border:none;
  }

  .roteiro-card{padding:0;overflow:hidden;}
  .roteiro-head{
    padding:15px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
  }
  .roteiro-title{font-family:'Fraunces',serif;font-weight:600;font-size:21px;}
  .roteiro-date{font-size:16px;color:var(--gold);margin-top:2px;}
  .roteiro-body{
    padding:0 16px 16px 16px;
    border-top:1px solid var(--line);
  }
  .item-row{
    display:flex;
    gap:10px;
    align-items:center;
    padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .item-row:last-of-type{border-bottom:none;}
  .item-time{
    font-family:'Fraunces',serif;
    font-weight:600;
    color:var(--gold);
    font-size:18px;
    width:52px;
    flex-shrink:0;
  }
  .item-activity{flex:1;font-size:18px;}
  .add-item-form{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .add-item-form input[type=text]:first-child{width:64px;flex:none;padding:11px 8px;text-align:center;}
  .chevron{color:var(--muted);transition:transform 0.2s;font-size:18px;}
  .chevron.open{transform:rotate(90deg);}

  nav.tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    max-width:560px;
    margin:0 auto;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom)) 6px;
    z-index:10;
  }
  nav.tabbar button{
    flex:1;
    background:transparent;
    color:var(--muted);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:8px 4px;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
  }
  nav.tabbar button.active{color:var(--gold);background:rgba(240,169,60,0.1);}
  nav.tabbar button svg{width:20px;height:20px;}

  .hidden{display:none !important;}
  .toast{
    position:fixed;
    bottom:96px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--surface-2);
    border:1px solid var(--gold);
    color:var(--cream);
    padding:9px 18px;
    border-radius:30px;
    font-size:17px;
    opacity:0;
    transition:all 0.25s;
    pointer-events:none;
    z-index:20;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="auth-gate"></div>
<div id="app" class="hidden">
  <header class="top">
    <div id="brand"></div>
    <button type="button" id="btn-logout" class="btn-logout">Sair</button>
  </header>

  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<nav class="tabbar hidden">
  <button data-tab="integrantes" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
    Integrantes
  </button>
  <button data-tab="musicas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
    Músicas
  </button>
  <button data-tab="roteiros">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="18" x2="13" y2="18"/></svg>
    Roteiros
  </button>
  <button data-tab="coreografias">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6 3 20 12 6 21 6 3"/></svg>
    Coreografias
  </button>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDU22nU2MOfb-3Z9xBHYVxrXtFDaG5_93g",
  authDomain: "bandinha-a22ce.firebaseapp.com",
  projectId: "bandinha-a22ce",
  storageBucket: "bandinha-a22ce.firebasestorage.app",
  messagingSenderId: "808882413270",
  appId: "1:808882413270:web:91dbb55bc2256847ae3377"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);
const googleProvider = new GoogleAuthProvider();
const EMAILS_PERMITIDOS = ["krysnamurty@gmail.com"];
const integrantesCol = collection(db, "integrantes");
const musicasCol = collection(db, "musicas");
const roteirosCol = collection(db, "roteiros");
const coreografiasCol = collection(db, "coreografias");
const configDocRef = doc(db, "config", "main");

(function(){
  const SHIRT_SIZES = ["PP","P","M","G","GG","XG"];

  let data = { integrantes: [], musicas: [], roteiros: [], coreografias: [], config: { titulo: "Bandinha", subtitulo: "Equipe de Canto" } };
  let loadedFlags = { integrantes: false, musicas: false, roteiros: false, coreografias: false, config: false };
  let currentUser = null;
  let authReady = false;
  let currentTab = "integrantes";
  let openRoteiroId = null;
  let loaded = false;
  let importOpen = false;
  let collapsedGroups = {};
  let editingNameId = null;
  let openMusicaId = null;
  let editingLetraId = null;
  let openCoreografiaId = null;
  let editingCoreografiaId = null;
  let editingBrand = false;

  const CATEGORIA_CORES = { "Femininas": "var(--rose)", "Masculinas": "var(--blue)", "Mista": "var(--gold)" };
  function corCategoria(cat){ return CATEGORIA_CORES[cat] || "var(--muted)"; }
  function extrairDriveId(url){
    const m = String(url).match(/\/d\/([a-zA-Z0-9_-]{10,})/) || String(url).match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
    return m ? m[1] : null;
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._h);
    showToast._h = setTimeout(()=> t.classList.remove("show"), 1600);
  }

  function markLoaded(key){
    loadedFlags[key] = true;
    if(Object.values(loadedFlags).every(Boolean)){ loaded = true; }
  }

  function safeRender(){
    if(openCoreografiaId){ return; }
    render();
  }

  function load(){
    onSnapshot(integrantesCol, snap => {
      data.integrantes = snap.docs.map(d => d.data());
      markLoaded("integrantes");
      safeRender();
    }, e => { console.error("Erro ao sincronizar integrantes:", e); showToast("Erro ao sincronizar"); });

    onSnapshot(musicasCol, snap => {
      data.musicas = snap.docs.map(d => d.data());
      markLoaded("musicas");
      safeRender();
    }, e => { console.error("Erro ao sincronizar músicas:", e); showToast("Erro ao sincronizar"); });

    onSnapshot(roteirosCol, snap => {
      data.roteiros = snap.docs.map(d => d.data());
      markLoaded("roteiros");
      safeRender();
    }, e => { console.error("Erro ao sincronizar roteiros:", e); showToast("Erro ao sincronizar"); });

    onSnapshot(coreografiasCol, snap => {
      data.coreografias = snap.docs.map(d => d.data());
      markLoaded("coreografias");
      safeRender();
    }, e => { console.error("Erro ao sincronizar coreografias:", e); showToast("Erro ao sincronizar"); });

    onSnapshot(configDocRef, snap => {
      data.config = snap.data() || { titulo: "Bandinha", subtitulo: "Equipe de Canto" };
      markLoaded("config");
      safeRender();
    }, e => { console.error("Erro ao sincronizar config:", e); showToast("Erro ao sincronizar"); });
  }

  function loadAuth(){
    onAuthStateChanged(auth, user => {
      if(user && !EMAILS_PERMITIDOS.includes(user.email)){
        signOut(auth);
        authReady = true;
        currentUser = null;
        renderAuthGate();
        showToast("Este e-mail não tem acesso ao painel");
        return;
      }
      currentUser = user;
      authReady = true;
      renderAuthGate();
      if(user){ load(); }
    });
  }

  function renderAuthGate(){
    const gate = document.getElementById("auth-gate");
    const appEl = document.getElementById("app");
    const navEl = document.querySelector("nav.tabbar");
    if(!authReady){
      gate.innerHTML = '<div class="empty">Carregando…</div>';
      gate.classList.remove("hidden");
      appEl.classList.add("hidden");
      navEl.classList.add("hidden");
      return;
    }
    if(currentUser){
      gate.classList.add("hidden");
      appEl.classList.remove("hidden");
      navEl.classList.remove("hidden");
      return;
    }
    appEl.classList.add("hidden");
    navEl.classList.add("hidden");
    gate.classList.remove("hidden");
    gate.innerHTML = `
      <div class="login-box" style="text-align:center;">
        <div class="brand" style="padding:0 0 18px 0;justify-content:center;">Bandinha <small>Equipe de Canto</small></div>
        <p style="color:var(--muted);font-size:15px;margin:0 0 18px 0;">Área restrita ao coordenador</p>
        <button type="button" id="btn-google-login" class="btn-import">Entrar com Google</button>
        <div id="login-error" style="color:var(--rose);font-size:17px;margin-top:10px;"></div>
      </div>
    `;
    document.getElementById("btn-google-login").addEventListener("click", async () => {
      const errEl = document.getElementById("login-error");
      errEl.textContent = "";
      try{
        await signInWithPopup(auth, googleProvider);
      }catch(err){
        console.error(err);
        errEl.textContent = "Não foi possível entrar. Tente novamente.";
      }
    });
  }

  // ---------- RENDER ----------
  function render(){
    const main = document.getElementById("main");
    renderBrand();
    if(!loaded){
      main.innerHTML = '<div class="empty">Carregando…</div>';
      return;
    }
    const scrollY = window.scrollY;
    if(currentTab === "integrantes") main.innerHTML = renderIntegrantes();
    else if(currentTab === "musicas") main.innerHTML = renderMusicas();
    else if(currentTab === "roteiros") main.innerHTML = renderRoteiros();
    else main.innerHTML = renderCoreografias();

    attachHandlers();
    window.scrollTo(0, scrollY);
  }

  function renderBrand(){
    const brand = document.getElementById("brand");
    if(!brand) return;
    const cfg = data.config || { titulo: "Bandinha", subtitulo: "Equipe de Canto" };
    if(editingBrand){
      brand.onclick = null;
      brand.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:6px;">
          <input type="text" id="input-brand-titulo" value="${escapeHtml(cfg.titulo)}" placeholder="Título" style="font-size:22px;padding:8px 10px;" />
          <input type="text" id="input-brand-subtitulo" value="${escapeHtml(cfg.subtitulo)}" placeholder="Subtítulo" style="font-size:17px;padding:7px 10px;" />
          <button type="button" class="btn-save-nome" style="width:auto;padding:0 14px;height:34px;" data-action="save-brand">Salvar</button>
        </div>
      `;
      brand.classList.add("brand");
      const t = document.getElementById("input-brand-titulo");
      if(t) t.focus();
      const btn = brand.querySelector('[data-action="save-brand"]');
      if(btn) btn.addEventListener("click", async () => {
        const titulo = document.getElementById("input-brand-titulo").value.trim();
        const subtitulo = document.getElementById("input-brand-subtitulo").value.trim();
        if(titulo){ await setDoc(configDocRef, { titulo, subtitulo }); }
        editingBrand = false;
        render();
      });
    } else {
      brand.className = "brand";
      brand.innerHTML = `${escapeHtml(cfg.titulo)} <small>${escapeHtml(cfg.subtitulo)}</small>`;
      brand.setAttribute("title", "Toque para editar o título");
      brand.style.cursor = "pointer";
      brand.onclick = () => { editingBrand = true; render(); };
    }
  }

  // ---------- HANDLERS ----------
  function attachHandlers(){
    const formInt = document.getElementById("form-integrante");
    if(formInt) formInt.addEventListener("submit", async e => {
      e.preventDefault();
      const input = document.getElementById("input-integrante-nome");
      const generoSelect = document.getElementById("input-integrante-genero");
      const instrumentalCheck = document.getElementById("input-integrante-instrumental");
      const nome = input.value.trim();
      const genero = generoSelect.value;
      if(!nome || !genero) { showToast("Preencha nome e sexo"); return; }
      const novoInt = { id: uid(), nome, genero, instrumental: instrumentalCheck.checked, camisa: "", inscricao: false, pagamentoCamisa: false, taxaEquipe: false };
      instrumentalCheck.checked = false;
      await setDoc(doc(integrantesCol, novoInt.id), novoInt); showToast("Integrante adicionado");
    });

    const formMus = document.getElementById("form-musica");
    if(formMus) formMus.addEventListener("submit", async e => {
      e.preventDefault();
      const input = document.getElementById("input-musica-nome");
      const nome = input.value.trim();
      if(!nome) return;
      const novaMus = { id: uid(), nome, status: "aprender", letra: "" };
      await setDoc(doc(musicasCol, novaMus.id), novaMus); showToast("Música adicionada");
    });

    const formRot = document.getElementById("form-roteiro");
    if(formRot) formRot.addEventListener("submit", async e => {
      e.preventDefault();
      const titulo = document.getElementById("input-roteiro-titulo").value.trim();
      const dataVal = document.getElementById("input-roteiro-data").value;
      if(!titulo) return;
      const novo = { id: uid(), titulo, data: dataVal, itens: [] };
      openRoteiroId = novo.id;
      await setDoc(doc(roteirosCol, novo.id), novo); showToast("Roteiro criado");
    });

    const formCoreo = document.getElementById("form-coreografia");
    if(formCoreo) formCoreo.addEventListener("submit", async e => {
      e.preventDefault();
      const categoria = document.getElementById("input-coreografia-categoria").value.trim();
      const titulo = document.getElementById("input-coreografia-titulo").value.trim();
      const link = document.getElementById("input-coreografia-link").value.trim();
      const driveId = extrairDriveId(link);
      if(!categoria || !titulo || !link) return;
      if(!driveId){ showToast("Link do Drive inválido"); return; }
      const novaCoreo = { id: uid(), categoria, titulo, link, driveId };
      await setDoc(doc(coreografiasCol, novaCoreo.id), novaCoreo); showToast("Coreografia adicionada");
    });

    document.querySelectorAll('[data-action="toggle-coreografia"]').forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        openCoreografiaId = (openCoreografiaId === id) ? null : id;
        editingCoreografiaId = null;
        render();
      });
    });

    document.querySelectorAll('[data-action="edit-coreografia"]').forEach(el => {
      el.addEventListener("click", () => {
        editingCoreografiaId = el.dataset.id;
        render();
      });
    });

    document.querySelectorAll('[data-action="save-coreografia"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.coreografias.find(c => c.id === el.dataset.id);
        if(!item) return;
        const titulo = document.querySelector(`[data-field="titulo"][data-id="${el.dataset.id}"]`).value.trim();
        const categoria = document.querySelector(`[data-field="categoria"][data-id="${el.dataset.id}"]`).value.trim();
        const link = document.querySelector(`[data-field="link"][data-id="${el.dataset.id}"]`).value.trim();
        const driveId = extrairDriveId(link);
        if(!categoria || !titulo || !link){ showToast("Preencha todos os campos"); return; }
        if(!driveId){ showToast("Link do Drive inválido"); return; }
        editingCoreografiaId = null;
        await updateDoc(doc(coreografiasCol, item.id), { titulo, categoria, link, driveId }); render();
      });
    });

    document.querySelectorAll('[data-action="del-coreografia"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.coreografias.find(c => c.id === el.dataset.id);
        if(!confirm(`Remover ${item ? `"${item.titulo}"` : "esta coreografia"}?`)) return;
        await deleteDoc(doc(coreografiasCol, el.dataset.id)); showToast("Coreografia removida");
      });
    });

    const btnToggleImport = document.getElementById("btn-toggle-import");
    if(btnToggleImport) btnToggleImport.addEventListener("click", () => {
      importOpen = !importOpen;
      render();
    });

    const btnImportNomes = document.getElementById("btn-import-nomes");
    if(btnImportNomes) btnImportNomes.addEventListener("click", async () => {
      const textarea = document.getElementById("input-import-nomes");
      const generoSelect = document.getElementById("input-import-genero");
      const instrumentalCheck = document.getElementById("input-import-instrumental");
      const raw = textarea.value;
      const genero = generoSelect.value;
      const instrumental = instrumentalCheck.checked;
      if(!genero){ showToast("Escolha se são rapazes ou moças"); return; }
      if(!raw.trim()){ showToast("Cole ao menos um nome"); return; }
      const nomes = raw
        .split(/[\n,;]/)
        .map(s => s.trim())
        .filter(s => s.length > 0);
      if(nomes.length === 0){ showToast("Nenhum nome encontrado"); return; }
      const existentes = new Set(data.integrantes.map(i => i.nome.toLowerCase()));
      const novos = [];
      nomes.forEach(nome => {
        if(!existentes.has(nome.toLowerCase())){
          novos.push({ id: uid(), nome, genero, instrumental, camisa: "", inscricao: false, pagamentoCamisa: false, taxaEquipe: false });
          existentes.add(nome.toLowerCase());
        }
      });
      importOpen = false;
      await Promise.all(novos.map(n => setDoc(doc(integrantesCol, n.id), n)));
      render();
      const adicionados = novos.length;
      const repetidos = nomes.length - adicionados;
      showToast(`${adicionados} nome${adicionados===1?"":"s"} importado${adicionados===1?"":"s"}${repetidos>0?` (${repetidos} já existia${repetidos===1?"":"m"})`:""}`);
    });

    document.querySelectorAll('[data-action="shirt"]').forEach(el => {
      el.addEventListener("change", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(item){ await updateDoc(doc(integrantesCol, item.id), { camisa: el.value }); showToast("Tamanho salvo"); }
      });
    });

    document.querySelectorAll('[data-action="edit-nome"]').forEach(el => {
      el.addEventListener("click", () => {
        editingNameId = el.dataset.id;
        render();
        const input = document.querySelector('.edit-nome-input');
        if(input){ input.focus(); input.select(); }
      });
    });

    async function commitNomeEdit(id, input){
      const item = data.integrantes.find(i => i.id === id);
      const novoNome = input.value.trim();
      if(item && novoNome){ await updateDoc(doc(integrantesCol, id), { nome: novoNome }); }
      editingNameId = null;
      render();
    }

    document.querySelectorAll('[data-action="save-nome"]').forEach(el => {
      el.addEventListener("click", () => {
        const input = document.querySelector('.edit-nome-input');
        if(input) commitNomeEdit(el.dataset.id, input);
      });
    });

    document.querySelectorAll('.edit-nome-input').forEach(el => {
      el.addEventListener("keydown", e => {
        if(e.key === "Enter"){ e.preventDefault(); commitNomeEdit(el.dataset.id, el); }
        else if(e.key === "Escape"){ editingNameId = null; render(); }
      });
      el.addEventListener("blur", () => {
        if(editingNameId === el.dataset.id) commitNomeEdit(el.dataset.id, el);
      });
    });

    document.querySelectorAll('[data-action="toggle-inscricao"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(!item) return;
        await updateDoc(doc(integrantesCol, item.id), { inscricao: !item.inscricao });
      });
    });

    document.querySelectorAll('[data-action="toggle-camisa-pag"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(!item) return;
        await updateDoc(doc(integrantesCol, item.id), { pagamentoCamisa: !item.pagamentoCamisa });
      });
    });

    document.querySelectorAll('[data-action="toggle-taxa"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(!item) return;
        await updateDoc(doc(integrantesCol, item.id), { taxaEquipe: !item.taxaEquipe });
      });
    });

    document.querySelectorAll('[data-action="toggle-instrumental"]').forEach(el => {
      el.addEventListener("change", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(item){ await updateDoc(doc(integrantesCol, item.id), { instrumental: el.checked }); }
      });
    });

    document.querySelectorAll('[data-action="fix-gender"]').forEach(el => {
      el.addEventListener("change", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(item){ await updateDoc(doc(integrantesCol, item.id), { genero: el.value }); }
      });
    });

    document.querySelectorAll('[data-action="toggle-group"]').forEach(el => {
      el.addEventListener("click", () => {
        const g = el.dataset.group;
        collapsedGroups[g] = !collapsedGroups[g];
        render();
      });
    });

    document.querySelectorAll('[data-action="del-integrante"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.integrantes.find(i => i.id === el.dataset.id);
        if(!confirm(`Remover ${item ? item.nome : "este integrante"}?`)) return;
        await deleteDoc(doc(integrantesCol, el.dataset.id)); showToast("Integrante removido");
      });
    });

    document.querySelectorAll('[data-action="toggle-musica"]').forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        openMusicaId = (openMusicaId === id) ? null : id;
        editingLetraId = null;
        render();
      });
    });

    document.querySelectorAll('[data-action="edit-letra"]').forEach(el => {
      el.addEventListener("click", () => {
        editingLetraId = el.dataset.id;
        render();
      });
    });

    document.querySelectorAll('[data-action="save-letra"]').forEach(el => {
      el.addEventListener("click", async () => {
        const textarea = document.querySelector('.lyrics-textarea');
        const item = data.musicas.find(m => m.id === el.dataset.id);
        if(item && textarea){ await updateDoc(doc(musicasCol, item.id), { letra: textarea.value.trim() }); }
        editingLetraId = null;
        render();
      });
    });

    document.querySelectorAll('[data-action="cycle-status"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.musicas.find(m => m.id === el.dataset.id);
        if(!item) return;
        const order = ["aprender","ensaiando","pronta"];
        const novoStatus = order[(order.indexOf(item.status)+1) % order.length];
        await updateDoc(doc(musicasCol, item.id), { status: novoStatus });
      });
    });

    document.querySelectorAll('[data-action="del-musica"]').forEach(el => {
      el.addEventListener("click", async () => {
        const item = data.musicas.find(m => m.id === el.dataset.id);
        if(!confirm(`Remover ${item ? `"${item.nome}"` : "esta música"}?`)) return;
        await deleteDoc(doc(musicasCol, el.dataset.id)); showToast("Música removida");
      });
    });

    document.querySelectorAll('[data-action="toggle-roteiro"]').forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        openRoteiroId = (openRoteiroId === id) ? null : id;
        render();
      });
    });

    document.querySelectorAll('[data-action="del-roteiro"]').forEach(el => {
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        const r = data.roteiros.find(r => r.id === el.dataset.id);
        if(!confirm(`Remover o roteiro ${r ? `"${r.titulo}"` : ""}?`)) return;
        await deleteDoc(doc(roteirosCol, el.dataset.id)); showToast("Roteiro removido");
      });
    });

    document.querySelectorAll('[data-action="del-item"]').forEach(el => {
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        if(!confirm("Remover este horário do roteiro?")) return;
        const r = data.roteiros.find(r => r.id === el.dataset.roteiro);
        if(r){
          const novosItens = r.itens.filter(it => it.id !== el.dataset.item);
          await updateDoc(doc(roteirosCol, r.id), { itens: novosItens });
        }
      });
    });

    document.querySelectorAll('[data-action="form-add-item"]').forEach(form => {
      form.addEventListener("submit", async e => {
        e.preventDefault();
        e.stopPropagation();
        const r = data.roteiros.find(r => r.id === form.dataset.roteiro);
        if(!r) return;
        const horario = form.querySelector(".item-horario-input").value.trim();
        const atividade = form.querySelector(".item-atividade-input").value.trim();
        if(!horario || !atividade) return;
        openRoteiroId = r.id;
        const novosItens = [...r.itens, { id: uid(), horario, atividade }];
        await updateDoc(doc(roteirosCol, r.id), { itens: novosItens });
      });
    });
  }

  document.querySelectorAll("nav.tabbar button").forEach(btn => {
    btn.addEventListener("click", () => {
      currentTab = btn.dataset.tab;
      document.querySelectorAll("nav.tabbar button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    });
  });

  document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

  loadAuth();
})();
</script>
</body>
</html>
