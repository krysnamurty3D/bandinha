<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bandinha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17130F;
    --surface: #241D17;
    --surface-2: #2E251D;
    --gold: #F0A93C;
    --cream: #F4EEE1;
    --muted: #B8A99A;
    --rose: #D6402A;
    --green: #7FA85E;
    --blue: #C9932E;
    --line: rgba(244,238,225,0.12);
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--cream);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:88px;
  }
  header.top{
    position:relative;
    overflow:hidden;
    aspect-ratio:1920/819;
    background-image:url('header.png');
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:flex-end;
  }
  header.top::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(23,19,15,0.92) 0%, rgba(23,19,15,0.35) 45%, transparent 75%);
    pointer-events:none;
  }
  .brand{
    position:relative;
    z-index:1;
    padding:14px 20px 14px 20px;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:32px;
    letter-spacing:0.2px;
    display:flex;
    align-items:baseline;
    gap:10px;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  .brand small{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:16px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold);
  }

  main{
    flex:1;
    padding:6px 18px 20px 18px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }
  .empty{
    text-align:center;
    padding:36px 16px;
    color:var(--muted);
    font-size:18px;
    border:1px dashed var(--line);
    border-radius:var(--radius);
  }
  .empty .note-dot{margin-bottom:8px;}
  .note-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--gold);
    display:inline-block;
    flex-shrink:0;
  }
  .section-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:24px;
    margin:18px 2px 12px 2px;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    user-select:none;
  }
  .section-title .chevron{margin-left:auto;}
  .video-frame{
    position:relative;
    width:100%;
    max-width:320px;
    margin:0 auto;
    padding-top:177.78%;
    border-radius:10px;
    overflow:hidden;
    background:#000;
  }
  .video-frame iframe{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    border:none;
  }

  .stat-row{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  .stat{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
  }
  .stat .num{font-family:'Fraunces',serif;font-size:26px;font-weight:700;}
  .stat .lbl{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}

  .song-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .song-name{flex:1;font-weight:600;font-size:19px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
  .status-pill{
    flex-shrink:0;
    border-radius:20px;
    padding:7px 13px;
    font-size:16px;
    font-weight:600;
    white-space:nowrap;
  }
  .status-aprender{background:rgba(214,64,42,0.15);color:var(--rose);}
  .status-ensaiando{background:rgba(240,169,60,0.15);color:var(--gold);}
  .status-pronta{background:rgba(127,168,94,0.15);color:var(--green);}
  .lyrics-box{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .lyrics-text{
    white-space:pre-wrap;
    font-size:18px;
    line-height:1.6;
    color:var(--cream);
  }

  .roteiro-card{padding:0;overflow:hidden;}
  .roteiro-head{
    padding:15px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
  }
  .roteiro-title{font-family:'Fraunces',serif;font-weight:600;font-size:21px;}
  .roteiro-date{font-size:16px;color:var(--gold);margin-top:2px;}
  .roteiro-body{
    padding:0 16px 16px 16px;
    border-top:1px solid var(--line);
  }
  .item-row{
    display:flex;
    gap:10px;
    align-items:center;
    padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .item-row:last-of-type{border-bottom:none;}
  .item-time{
    font-family:'Fraunces',serif;
    font-weight:600;
    color:var(--gold);
    font-size:18px;
    width:52px;
    flex-shrink:0;
  }
  .item-activity{flex:1;font-size:18px;}
  .chevron{color:var(--muted);transition:transform 0.2s;font-size:18px;}
  .chevron.open{transform:rotate(90deg);}

  nav.tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    max-width:560px;
    margin:0 auto;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom)) 6px;
    z-index:10;
  }
  nav.tabbar button{
    flex:1;
    background:transparent;
    color:var(--muted);
    border:none;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:8px 4px;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
  }
  nav.tabbar button.active{color:var(--gold);background:rgba(240,169,60,0.1);}
  nav.tabbar button svg{width:20px;height:20px;}

  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand" id="brand">Bandinha <small>Equipe de Canto</small></div>
  </header>

  <main id="main"></main>
</div>

<nav class="tabbar">
  <button data-tab="musicas" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
    Músicas
  </button>
  <button data-tab="roteiros">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="18" x2="13" y2="18"/></svg>
    Roteiros
  </button>
  <button data-tab="coreografias">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6 3 20 12 6 21 6 3"/></svg>
    Coreografias
  </button>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDU22nU2MOfb-3Z9xBHYVxrXtFDaG5_93g",
  authDomain: "bandinha-a22ce.firebaseapp.com",
  projectId: "bandinha-a22ce",
  storageBucket: "bandinha-a22ce.firebasestorage.app",
  messagingSenderId: "808882413270",
  appId: "1:808882413270:web:91dbb55bc2256847ae3377"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const musicasCol = collection(db, "musicas");
const roteirosCol = collection(db, "roteiros");
const coreografiasCol = collection(db, "coreografias");
const configDocRef = doc(db, "config", "main");

(function(){
  let data = { musicas: [], roteiros: [], coreografias: [], config: { titulo: "Bandinha", subtitulo: "Equipe de Canto" } };
  let currentTab = "musicas";
  let openRoteiroId = null;
  let openMusicaId = null;
  let openCoreografiaId = null;
  let collapsedGroups = {};
  let loaded = false;
  let loadedFlags = { musicas: false, roteiros: false, coreografias: false, config: false };

  const CATEGORIA_CORES = { "Femininas": "var(--rose)", "Masculinas": "var(--blue)", "Mista": "var(--gold)" };
  function corCategoria(cat){ return CATEGORIA_CORES[cat] || "var(--muted)"; }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function markLoaded(key){
    loadedFlags[key] = true;
    if(Object.values(loadedFlags).every(Boolean)){ loaded = true; }
  }

  function safeRender(){
    if(openCoreografiaId){ return; }
    render();
  }

  function load(){
    onSnapshot(musicasCol, snap => {
      data.musicas = snap.docs.map(d => d.data());
      markLoaded("musicas");
      safeRender();
    }, e => { console.error("Erro ao sincronizar músicas:", e); });

    onSnapshot(roteirosCol, snap => {
      data.roteiros = snap.docs.map(d => d.data());
      markLoaded("roteiros");
      safeRender();
    }, e => { console.error("Erro ao sincronizar roteiros:", e); });

    onSnapshot(coreografiasCol, snap => {
      data.coreografias = snap.docs.map(d => d.data());
      markLoaded("coreografias");
      safeRender();
    }, e => { console.error("Erro ao sincronizar coreografias:", e); });

    onSnapshot(configDocRef, snap => {
      data.config = snap.data() || { titulo: "Bandinha", subtitulo: "Equipe de Canto" };
      markLoaded("config");
      safeRender();
    }, e => { console.error("Erro ao sincronizar config:", e); });
  }

  // ---------- RENDER ----------
  function render(){
    const main = document.getElementById("main");
    renderBrand();
    if(!loaded){
      main.innerHTML = '<div class="empty">Carregando…</div>';
      return;
    }
    const scrollY = window.scrollY;
    main.innerHTML = currentTab === "musicas" ? renderMusicas() : currentTab === "roteiros" ? renderRoteiros() : renderCoreografias();
    attachHandlers();
    window.scrollTo(0, scrollY);
  }

  function renderBrand(){
    const brand = document.getElementById("brand");
    if(!brand) return;
    const cfg = data.config || { titulo: "Bandinha", subtitulo: "Equipe de Canto" };
    brand.innerHTML = `${escapeHtml(cfg.titulo)} <small>${escapeHtml(cfg.subtitulo)}</small>`;
  }

  function renderMusicas(){
    const total = data.musicas.length;
    const prontas = data.musicas.filter(m => m.status === "pronta").length;
    let html = `
      <div class="stat-row">
        <div class="stat"><div class="num">${total}</div><div class="lbl">Músicas</div></div>
        <div class="stat"><div class="num">${prontas}/${total}</div><div class="lbl">Prontas</div></div>
      </div>
    `;
    if(total === 0){
      html += `<div class="empty"><div class="note-dot"></div><br>Nenhuma música na lista ainda.</div>`;
    } else {
      const labels = {aprender:"A aprender", ensaiando:"Ensaiando", pronta:"Pronta"};
      html += data.musicas.map(m => {
        const open = openMusicaId === m.id;
        return `
        <div class="card">
          <div class="song-row">
            <div class="song-name" data-action="toggle-musica" data-id="${m.id}">${escapeHtml(m.nome)}</div>
            <span class="status-pill status-${m.status}">${labels[m.status] || m.status}</span>
          </div>
          ${open ? `
            <div class="lyrics-box">
              ${m.letra ? `<div class="lyrics-text">${escapeHtml(m.letra)}</div>` : `<div style="color:var(--muted);font-size:17px;">Letra ainda não cadastrada.</div>`}
            </div>
          ` : ""}
        </div>
      `;
      }).join("");
    }
    return html;
  }

  function renderRoteiros(){
    let html = "";
    if(data.roteiros.length === 0){
      html += `<div class="empty"><div class="note-dot"></div><br>Nenhum roteiro publicado ainda.</div>`;
    } else {
      const ordered = [...data.roteiros].sort((a,b) => (a.data||"").localeCompare(b.data||""));
      html += ordered.map(r => {
        const open = openRoteiroId === r.id;
        const itensOrdenados = [...r.itens].sort((a,b) => a.horario.localeCompare(b.horario));
        return `
        <div class="card roteiro-card">
          <div class="roteiro-head" data-action="toggle-roteiro" data-id="${r.id}">
            <div>
              <div class="roteiro-title">${escapeHtml(r.titulo)}</div>
              ${r.data ? `<div class="roteiro-date">${formatDate(r.data)}</div>` : ""}
            </div>
            <span class="chevron ${open?"open":""}">▶</span>
          </div>
          <div class="roteiro-body ${open?"":"hidden"}">
            ${itensOrdenados.length === 0 ? '<div style="color:var(--muted);font-size:17px;padding:10px 0;">Nenhum horário adicionado ainda.</div>' : itensOrdenados.map(it => `
              <div class="item-row">
                <div class="item-time">${escapeHtml(it.horario)}</div>
                <div class="item-activity">${escapeHtml(it.atividade)}</div>
              </div>
            `).join("")}
          </div>
        </div>`;
      }).join("");
    }
    return html;
  }

  function formatDate(iso){
    const [y,m,d] = iso.split("-");
    return `${d}/${m}/${y}`;
  }

  function renderCoreografias(){
    if(data.coreografias.length === 0){
      return `<div class="empty"><div class="note-dot"></div><br>Nenhuma coreografia publicada ainda.</div>`;
    }
    const categorias = [...new Set(data.coreografias.map(c => c.categoria))].sort();
    return categorias.map(cat => renderCoreografiaGroup(cat, data.coreografias.filter(c => c.categoria === cat).sort((a,b) => a.titulo.localeCompare(b.titulo)))).join("");
  }

  function renderCoreografiaGroup(categoria, lista){
    const key = "coreo-" + categoria;
    const collapsed = !!collapsedGroups[key];
    const color = corCategoria(categoria);
    let html = `
      <div class="section-title" data-action="toggle-group" data-group="${key}">
        <span class="note-dot" style="background:${color}"></span>${escapeHtml(categoria)} <span style="color:var(--muted);font-weight:400;font-size:18px;">(${lista.length})</span>
        <span class="chevron ${collapsed?"":"open"}">▶</span>
      </div>
      <div class="${collapsed?"hidden":""}">`;
    html += lista.map(c => {
      const open = openCoreografiaId === c.id;
      return `
      <div class="card" style="border-left:3px solid ${color};">
        <div class="song-row">
          <div class="song-name" data-action="toggle-coreografia" data-id="${c.id}">${escapeHtml(c.titulo)}</div>
        </div>
        ${open ? `
          <div class="lyrics-box">
            <div class="video-frame"><iframe src="https://drive.google.com/file/d/${c.driveId}/preview" allow="autoplay" allowfullscreen></iframe></div>
          </div>
        ` : ""}
      </div>`;
    }).join("");
    html += `</div>`;
    return html;
  }

  // ---------- HANDLERS ----------
  function attachHandlers(){
    document.querySelectorAll('[data-action="toggle-musica"]').forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        openMusicaId = (openMusicaId === id) ? null : id;
        render();
      });
    });

    document.querySelectorAll('[data-action="toggle-roteiro"]').forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        openRoteiroId = (openRoteiroId === id) ? null : id;
        render();
      });
    });

    document.querySelectorAll('[data-action="toggle-coreografia"]').forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        openCoreografiaId = (openCoreografiaId === id) ? null : id;
        render();
      });
    });

    document.querySelectorAll('[data-action="toggle-group"]').forEach(el => {
      el.addEventListener("click", () => {
        const g = el.dataset.group;
        collapsedGroups[g] = !collapsedGroups[g];
        render();
      });
    });
  }

  document.querySelectorAll("nav.tabbar button").forEach(btn => {
    btn.addEventListener("click", () => {
      currentTab = btn.dataset.tab;
      document.querySelectorAll("nav.tabbar button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    });
  });

  load();
})();
</script>
</body>
</html>
